  function renderCombinedCalendarGrid() {
    var grid = els.combinedCalendarGrid;
    grid.innerHTML = '';
    var people = getFilteredSchedulePersonEntries();
    var year = combinedCalendarViewDate.getFullYear();
    var month = combinedCalendarViewDate.getMonth();
    var firstDay = new Date(year, month, 1);
    var gridStart = addDays(firstDay, -firstDay.getDay());
    var todayKey = dateKey(new Date());
    var MAX_VISIBLE_ENTRIES = 4;

    for (var i = 0; i < 42; i++) {
      (function () {
        var date = addDays(gridStart, i);
        var dk = dateKey(date);

        var cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'calendar-day-cell';
        if (date.getMonth() !== month) cell.classList.add('is-other-month');
        if (dk === todayKey) cell.classList.add('is-today');
        if (dk === combinedCalendarSelectedDk) cell.classList.add('is-selected');

        var num = document.createElement('span');
        num.className = 'calendar-day-number';
        num.textContent = String(date.getDate());
        cell.appendChild(num);

        var hol = holidayForDate(date);
        if (hol) {
          var holWrap = document.createElement('span');
          holWrap.className = 'calendar-day-holiday' + (hol.kind ? ' calendar-holiday-' + hol.kind : '');
          if (hol.kind) {
            var holIcon = document.createElement('span');
            holIcon.className = 'calendar-holiday-icon';
            holIcon.textContent = HOLIDAY_ICONS[hol.kind];
            holIcon.setAttribute('aria-hidden', 'true');
            holWrap.appendChild(holIcon);
          }
          var holText = document.createElement('span');
          holText.className = 'calendar-holiday-text';
          holText.textContent = hol.name;
          holWrap.appendChild(holText);
          cell.appendChild(holWrap);
        }

        var entriesWrap = document.createElement('div');
        entriesWrap.className = 'combined-day-entries';
        var shown = 0;
        var totalWithContent = 0;

        people.forEach(function (p) {
          var dayMap = scheduleDocsCache[p.key] || {};
          var entry = dayMap[dk];
          if (!entry) return;
          var hasContent = !!(entry.jobName || entry.off || entry.holiday);
          if (!hasContent) return;
          totalWithContent++;
          if (shown >= MAX_VISIBLE_ENTRIES) return; // rest folded into "+N more"
          shown++;

          var row = document.createElement('span');
          row.className = 'combined-day-entry';
          var c = colorForKey(entry.color);
          if (c) {
            row.style.background = c.bg;
            row.style.borderLeftColor = c.border;
          }
          var nameSpan = document.createElement('span');
          nameSpan.className = 'combined-day-entry-name';
          nameSpan.textContent = p.name;
          row.appendChild(nameSpan);

          var detail = entry.jobName || '';
          if (entry.holiday) detail = detail ? (detail + ' (Holiday)') : 'Holiday';
          if (entry.off) detail = detail ? (detail + ' (Off)') : 'Off';
          if (detail) row.appendChild(document.createTextNode(' — ' + detail));

          entriesWrap.appendChild(row);
        });

        if (totalWithContent > shown) {
          var more = document.createElement('span');
          more.className = 'combined-day-more';
          more.textContent = '+' + (totalWithContent - shown) + ' more';
          entriesWrap.appendChild(more);
        }

        cell.appendChild(entriesWrap);
        cell.addEventListener('click', function () { selectCombinedCalendarDay(dk); });
        grid.appendChild(cell);
      })();
    }

    renderCombinedDayDetail();
  }

  // All 8 Task fields, in the same order/labels used by the per-person day
  // editor - reused here read-only so the combined detail panel shows
  // "all information entered" for a day, not just the job name.
  var COMBINED_TASK_FIELD_DEFS = [
    ['jobName', 'Job Name'], ['po', 'PO #'], ['address', 'Address'], ['stage', 'Stage of Work'],
    ['pm', 'PM'], ['contractor', 'Contractor'], ['superintendent', 'Superintendent'], ['superintendentPhone', 'Superintendent Phone']
  ];

  function taskHasAnyField(task) {
    if (!task) return false;
    return !!(task.jobName || task.po || task.address || task.stage || task.pm || task.contractor || task.superintendent || task.superintendentPhone);
  }

  // Renders one task's non-empty fields as a read-only label/value grid.
  // Returns true if anything was appended.
  function appendReadOnlyFieldGrid(container, task) {
    if (!taskHasAnyField(task)) return false;
    var grid = document.createElement('div');
    grid.className = 'calendar-field-grid combined-detail-field-grid';
    COMBINED_TASK_FIELD_DEFS.forEach(function (def) {
      var val = task[def[0]];
      if (!val) return;
      var field = document.createElement('div');
      field.className = 'calendar-field';
      var label = document.createElement('span');
      label.className = 'calendar-field-label';
      label.textContent = def[1];
      var value = document.createElement('span');
      value.className = 'combined-detail-field-value';
      value.textContent = val;
      field.appendChild(label);
      field.appendChild(value);
      grid.appendChild(field);
    });
    container.appendChild(grid);
    return true;
  }

  // Read-only "everything entered this day" panel, shown below the grid
  // once a day is selected - combines every person's entry for that day,
  // each keeping its own individually-selected color (never a shared
  // combined-view color), labeled with which division it belongs to.
  function renderCombinedDayDetail() {
    var panel = els.combinedCalendarDayDetail;
    panel.innerHTML = '';
    if (!combinedCalendarSelectedDk) { panel.hidden = true; return; }

    var dk = combinedCalendarSelectedDk;
    var parts = dk.split('-');
    var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));

    var head = document.createElement('div');
    head.className = 'calendar-day-editor-head';
    var title = document.createElement('span');
    title.className = 'calendar-day-editor-title';
    title.textContent = MONTH_NAMES_FULL[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
    head.appendChild(title);
    panel.appendChild(head);

    var people = getFilteredSchedulePersonEntries();
    var any = false;

    people.forEach(function (p) {
      var dayMap = scheduleDocsCache[p.key] || {};
      var entry = dayMap[dk];
      if (!entry) return;
      var hasContent = !!(entry.jobName || entry.off || entry.holiday || taskHasAnyField(entry.task2) || taskHasAnyField(entry.task3));
      if (!hasContent) return;
      any = true;

      var card = document.createElement('div');
      card.className = 'combined-detail-card';
      var c = colorForKey(entry.color);
      if (c) {
        card.style.borderLeftColor = c.border;
        card.style.background = c.bg;
      }

      var cardHead = document.createElement('div');
      cardHead.className = 'combined-detail-card-head';
      var nameEl = document.createElement('span');
      nameEl.className = 'combined-detail-card-name';
      nameEl.textContent = p.name;
      cardHead.appendChild(nameEl);
      var divEl = document.createElement('span');
      divEl.className = 'combined-detail-card-division';
      divEl.textContent = p.division;
      cardHead.appendChild(divEl);
      if (entry.holiday) {
        var holTag = document.createElement('span');
        holTag.className = 'combined-detail-tag combined-detail-tag-holiday';
        holTag.textContent = 'Holiday';
        cardHead.appendChild(holTag);
      }
      if (entry.off) {
        var offTag = document.createElement('span');
        offTag.className = 'combined-detail-tag combined-detail-tag-off';
        offTag.textContent = 'Off';
        cardHead.appendChild(offTag);
      }
      card.appendChild(cardHead);

      appendReadOnlyFieldGrid(card, entry);

      if (taskHasAnyField(entry.task2)) {
        var t2Label = document.createElement('div');
        t2Label.className = 'combined-detail-task-label';
        t2Label.textContent = 'Task 2';
        card.appendChild(t2Label);
        appendReadOnlyFieldGrid(card, entry.task2);
      }
      if (taskHasAnyField(entry.task3)) {
        var t3Label = document.createElement('div');
        t3Label.className = 'combined-detail-task-label';
        t3Label.textContent = 'Task 3';
        card.appendChild(t3Label);
        appendReadOnlyFieldGrid(card, entry.task3);
      }

      panel.appendChild(card);
    });

    if (!any) {
      var empty = document.createElement('p');
      empty.className = 'combined-detail-empty';
      empty.textContent = 'No schedule entries for this day.';
      panel.appendChild(empty);
    }

    panel.hidden = false;
  }

  // ---------------- Gantt Chart (view-only, pulls from the same schedule
  // data as the Combined Calendar above - Plumbing section first, then
  // HVAC. A 1 Month / 3 Months toggle sets how many months are visible at
  // once; Prev/Next always move the view by exactly that many months.
  // Each row is one person; contiguous days that share the same job name +
  // color + off/holiday flags are merged into a single bar (so a job
  // entered across a date range shows as one bar, not one sliver per day),
  // colored with the exact same palette (colorForKey) used everywhere else
  // in the app. Days with nothing entered leave a gap - no bar drawn. ----
  var ganttOpen = false;
  var ganttViewDate = firstOfMonth(new Date()); // first day of the visible window's first month
  var ganttSpan = 3; // 1 or 3 - how many months are visible at once

  function openGanttView() {
    ganttOpen = true;
    ganttViewDate = firstOfMonth(new Date());
    ganttSpan = 3;
    getAllSchedulePersonEntries().forEach(function (p) { ensureScheduleSub(p.key); });
    els.ganttOverlay.hidden = false;
    renderGanttOverlay();
  }

  function closeGanttView() {
    ganttOpen = false;
    els.ganttOverlay.hidden = true;
  }

  function shiftGanttMonths(delta) {
    ganttViewDate = new Date(ganttViewDate.getFullYear(), ganttViewDate.getMonth() + delta, 1);
    renderGanttOverlay();
  }

  function resetGanttToToday() {
    ganttViewDate = firstOfMonth(new Date());
    renderGanttOverlay();
  }

  function setGanttSpan(span) {
    if (ganttSpan === span) return;
    ganttSpan = span;
    renderGanttOverlay();
  }

  function updateGanttSpanButtons() {
    [
      [els.ganttSpan1Btn, 1],
      [els.ganttSpan3Btn, 3]
    ].forEach(function (pair) {
      if (!pair[0]) return;
      pair[0].classList.toggle('is-active', ganttSpan === pair[1]);
    });
    var spanLabel = ganttSpan === 1 ? 'Month' : (ganttSpan + ' Months');
    els.ganttPrevBtn.textContent = '‹ Prev ' + spanLabel;
    els.ganttNextBtn.textContent = 'Next ' + spanLabel + ' ›';
  }

  function renderGanttOverlay() {
    if (!ganttOpen) return;
    var rangeStart = ganttViewDate;
    var rangeEndExclusive = new Date(rangeStart.getFullYear(), rangeStart.getMonth() + ganttSpan, 1);
    var lastVisibleDay = addDays(rangeEndExclusive, -1);
    if (ganttSpan === 1) {
      els.ganttMonthLabel.textContent = MONTH_NAMES_FULL[rangeStart.getMonth()] + ' ' + rangeStart.getFullYear();
    } else {
      els.ganttMonthLabel.textContent = MONTH_NAMES_FULL[rangeStart.getMonth()] + ' ' + rangeStart.getFullYear() + ' – ' + MONTH_NAMES_FULL[lastVisibleDay.getMonth()] + ' ' + lastVisibleDay.getFullYear();
    }
    updateGanttSpanButtons();
    renderGanttChart(rangeStart, rangeEndExclusive);
  }

  // One segment per calendar month touched by the visible range, each
  // sized proportionally to how many of its days fall inside that range.
  function buildGanttMonthSegments(rangeStart, rangeEndExclusive, totalDays) {
    var segments = [];
    var cur = new Date(rangeStart);
    var offset = 0;
    while (cur < rangeEndExclusive) {
      var monthStart = cur;
      var nextMonth = new Date(monthStart.getFullYear(), monthStart.getMonth() + 1, 1);
      var segEnd = nextMonth < rangeEndExclusive ? nextMonth : rangeEndExclusive;
      var dayCount = Math.round((segEnd - monthStart) / 86400000);
      segments.push({
        label: MONTH_NAMES_FULL[monthStart.getMonth()] + ' ' + monthStart.getFullYear(),
        leftPct: (offset / totalDays) * 100,
        widthPct: (dayCount / totalDays) * 100
      });
      offset += dayCount;
      cur = nextMonth;
    }
    return segments;
  }

  function buildGanttMonthHeader(rangeStart, rangeEndExclusive, totalDays) {
    var header = document.createElement('div');
    header.className = 'gantt-row gantt-timeline-header-row';
    var nameSpacer = document.createElement('div');
    nameSpacer.className = 'gantt-row-name';
    header.appendChild(nameSpacer);
    var timeline = document.createElement('div');
    timeline.className = 'gantt-timeline';
    var monthHeader = document.createElement('div');
    monthHeader.className = 'gantt-month-header';
    buildGanttMonthSegments(rangeStart, rangeEndExclusive, totalDays).forEach(function (seg) {
      var segEl = document.createElement('div');
      segEl.className = 'gantt-month-seg';
      segEl.style.left = seg.leftPct + '%';
      segEl.style.width = seg.widthPct + '%';
      segEl.textContent = seg.label;
      monthHeader.appendChild(segEl);
    });
    timeline.appendChild(monthHeader);
    header.appendChild(timeline);
    return header;
  }

  // Merges a person's day-by-day schedule entries within [rangeStart,
  // rangeEndExclusive) into contiguous bars. A bar continues only while
  // the day-to-day content is identical (job name, color, off, holiday);
  // a day with nothing entered breaks the run and leaves a gap.
  function buildGanttBars(personKey, rangeStart, rangeEndExclusive, totalDays) {
    var dayMap = scheduleDocsCache[personKey] || {};
    var bars = [];
    var cur = new Date(rangeStart);
    var offset = 0;
    var curBar = null;
    while (cur < rangeEndExclusive) {
      var dk = dateKey(cur);
      var entry = dayMap[dk];
      var hasContent = !!(entry && (entry.jobName || entry.off || entry.holiday));
      var key = hasContent ? ((entry.jobName || '') + '|' + (entry.color || '') + '|' + (entry.off ? 1 : 0) + '|' + (entry.holiday ? 1 : 0)) : null;
      if (hasContent && curBar && curBar.key === key) {
        curBar.days++;
      } else {
        if (curBar) bars.push(curBar);
        curBar = hasContent ? { key: key, entry: entry, startOffset: offset, days: 1 } : null;
      }
      offset++;
      cur = addDays(cur, 1);
    }
    if (curBar) bars.push(curBar);
    return bars.map(function (b) {
      var c = colorForKey(b.entry.color);
      var label = b.entry.jobName || '';
      if (b.entry.holiday) label = label ? (label + ' (Holiday)') : 'Holiday';
      if (b.entry.off) label = label ? (label + ' (Off)') : 'Off';
      return {
        leftPct: (b.startOffset / totalDays) * 100,
        widthPct: (b.days / totalDays) * 100,
        label: label,
        bg: c ? c.bg : null,
        border: c ? c.border : null
      };
    });
  }

  function buildGanttRow(person, rangeStart, rangeEndExclusive, totalDays) {
    var row = document.createElement('div');
    row.className = 'gantt-row';
    var nameEl = document.createElement('div');
    nameEl.className = 'gantt-row-name';
    nameEl.textContent = person.name;
    nameEl.title = person.name;
    row.appendChild(nameEl);

    var timeline = document.createElement('div');
    timeline.className = 'gantt-row-timeline';
    buildGanttBars(person.key, rangeStart, rangeEndExclusive, totalDays).forEach(function (bar) {
      var barEl = document.createElement('div');
      barEl.className = 'gantt-bar';
      barEl.style.left = bar.leftPct + '%';
      barEl.style.width = bar.widthPct + '%';
      if (bar.bg) { barEl.style.background = bar.bg; barEl.style.borderColor = bar.border; }
      if (bar.label) { barEl.textContent = bar.label; barEl.title = bar.label; }
      timeline.appendChild(barEl);
    });
    row.appendChild(timeline);
    return row;
  }

  function buildGanttSection(title, people, rangeStart, rangeEndExclusive, totalDays) {
    var section = document.createElement('div');
    section.className = 'gantt-section';
    var heading = document.createElement('div');
    heading.className = 'gantt-section-title';
    heading.textContent = title;
    section.appendChild(heading);
    if (!people.length) {
      var empty = document.createElement('div');
      empty.className = 'gantt-empty';
      empty.textContent = 'No ' + title + ' crew with a schedule tab yet.';
      section.appendChild(empty);
      return section;
    }
    people.forEach(function (p) {
      section.appendChild(buildGanttRow(p, rangeStart, rangeEndExclusive, totalDays));
    });
    return section;
  }

  function renderGanttChart(rangeStart, rangeEndExclusive) {
    var body = els.ganttBody;
    body.innerHTML = '';
    var totalDays = Math.round((rangeEndExclusive - rangeStart) / 86400000);
    var all = getAllSchedulePersonEntries();
    var plumbing = all.filter(function (p) { return p.division === 'Plumbing'; });
    var hvac = all.filter(function (p) { return p.division === 'HVAC'; });

    body.appendChild(buildGanttMonthHeader(rangeStart, rangeEndExclusive, totalDays));
    body.appendChild(buildGanttSection('Plumbing', plumbing, rangeStart, rangeEndExclusive, totalDays));
    body.appendChild(buildGanttSection('HVAC', hvac, rangeStart, rangeEndExclusive, totalDays));
  }

  function renderDayEditor(personKey, disableControls) {
    var editor = els.calendarDayEditor;
    editor.innerHTML = '';
    if (!calendarSelectedDk) { editor.hidden = true; return; }
    editor.hidden = false;

    var dk = calendarSelectedDk;
    var dp = dk.split('-');
    var date = new Date(parseInt(dp[0], 10), parseInt(dp[1], 10) - 1, parseInt(dp[2], 10));
    var entries = scheduleDocsCache[personKey] || {};
    var emptyTask = { jobName: '', po: '', address: '', stage: '', pm: '', contractor: '', superintendent: '', superintendentPhone: '' };
    var entry = entries[dk] || { jobName: '', po: '', address: '', stage: '', pm: '', contractor: '', superintendent: '', superintendentPhone: '', color: '', off: false, holiday: false };
    var task2Source = entry.task2 || emptyTask;
    var task3Source = entry.task3 || emptyTask;

    var head = document.createElement('div');
    head.className = 'calendar-day-editor-head';
    var title = document.createElement('span');
    title.className = 'calendar-day-editor-title';
    title.textContent = fmtDayLabel(date);
    head.appendChild(title);
    var closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'calendar-back-btn';
    closeBtn.textContent = 'Close';
    closeBtn.addEventListener('click', function () { calendarSelectedDk = null; renderCalendarOverlay(); });
    head.appendChild(closeBtn);
    editor.appendChild(head);

    // Task 2 / Task 3 toggle buttons - sit right at the top of the day
    // editor, above the Task 1 fields.
    var taskTabsRow = document.createElement('div');
    taskTabsRow.className = 'calendar-task-tabs-row';
    editor.appendChild(taskTabsRow);

    var TASK_FIELD_KEYS = ['jobName', 'po', 'address', 'stage', 'pm', 'contractor', 'superintendent', 'superintendentPhone'];

    function hasTaskData(t) {
      return !!(t.jobName || t.po || t.address || t.stage || t.pm || t.contractor || t.superintendent || t.superintendentPhone);
    }

    function makeTaskTabBtn(labelText) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'calendar-task-tab-btn';
      btn.textContent = labelText;
      btn.disabled = disableControls;
      taskTabsRow.appendChild(btn);
      return btn;
    }

    var task2Btn = makeTaskTabBtn('Task 2');
    var task3Btn = makeTaskTabBtn('Task 3');

    var fieldGrid = document.createElement('div');
    fieldGrid.className = 'calendar-field-grid';
    editor.appendChild(fieldGrid);

    function makeField(grid, labelText, value, maxLen, spanFull) {
      var wrap = document.createElement('div');
      wrap.className = 'calendar-field' + (spanFull ? ' span-2' : '');
      var lbl = document.createElement('span');
      lbl.className = 'calendar-field-label';
      lbl.textContent = labelText;
      wrap.appendChild(lbl);
      var input = document.createElement('input');
      input.type = 'text';
      input.maxLength = maxLen;
      input.value = value;
      input.disabled = disableControls;
      wrap.appendChild(input);
      grid.appendChild(wrap);
      return input;
    }

    var jobNameInput = makeField(fieldGrid, 'Job Name', entry.jobName, 60, false);
    var poInput = makeField(fieldGrid, 'PO #', entry.po, 30, false);
    var addressInput = makeField(fieldGrid, 'Address', entry.address, 100, true);
    var stageInput = makeField(fieldGrid, 'Stage of Work', entry.stage, 60, true);
    var pmInput = makeField(fieldGrid, 'PM', entry.pm, 60, false);
    var contractorInput = makeField(fieldGrid, 'Contractor', entry.contractor, 60, false);
    var superintendentInput = makeField(fieldGrid, 'Superintendent', entry.superintendent, 60, false);
    var superintendentPhoneInput = makeField(fieldGrid, 'Superintendent Phone', entry.superintendentPhone, 20, false);

    function buildTaskBlock(labelText, source) {
      var block = document.createElement('div');
      block.className = 'calendar-field-grid calendar-task-block';
      var label = document.createElement('span');
      label.className = 'calendar-task-block-label';
      label.textContent = labelText;
      block.appendChild(label);
      var f = {
        block: block,
        jobName: makeField(block, 'Job Name', source.jobName, 60, false),
        po: makeField(block, 'PO #', source.po, 30, false),
        address: makeField(block, 'Address', source.address, 100, true),
        stage: makeField(block, 'Stage of Work', source.stage, 60, true),
        pm: makeField(block, 'PM', source.pm, 60, false),
        contractor: makeField(block, 'Contractor', source.contractor, 60, false),
        superintendent: makeField(block, 'Superintendent', source.superintendent, 60, false),
        superintendentPhone: makeField(block, 'Superintendent Phone', source.superintendentPhone, 20, false)
      };
      editor.appendChild(block);
      return f;
    }

    var task2 = buildTaskBlock('Task 2', task2Source);
    var task3 = buildTaskBlock('Task 3', task3Source);

    function setTaskOpen(fields, btn, open) {
      fields.block.hidden = !open;
      btn.classList.toggle('is-active', open);
    }
    setTaskOpen(task2, task2Btn, hasTaskData(task2Source));
    setTaskOpen(task3, task3Btn, hasTaskData(task3Source));
    task2Btn.addEventListener('click', function () { setTaskOpen(task2, task2Btn, task2.block.hidden); });
    task3Btn.addEventListener('click', function () { setTaskOpen(task3, task3Btn, task3.block.hidden); });

    function readTask(fields) {
      return {
        jobName: fields.jobName.value,
        po: fields.po.value,
        address: fields.address.value,
        stage: fields.stage.value,
        pm: fields.pm.value,
        contractor: fields.contractor.value,
        superintendent: fields.superintendent.value,
        superintendentPhone: fields.superintendentPhone.value
      };
    }

    var currentColor = entry.color || '';
    var currentOff = entry.off === true;
    var currentHoliday = entry.holiday === true;

    var save = function () {
      saveScheduleEntry(personKey, dk, {
        jobName: jobNameInput.value,
        po: poInput.value,
        address: addressInput.value,
        stage: stageInput.value,
        pm: pmInput.value,
        contractor: contractorInput.value,
        superintendent: superintendentInput.value,
        superintendentPhone: superintendentPhoneInput.value,
        task2: readTask(task2),
        task3: readTask(task3),
        color: currentColor,
        off: currentOff,
        holiday: currentHoliday
      });
      renderCalendarGrid(personKey, disableControls);
    };
    jobNameInput.addEventListener('blur', save);
    poInput.addEventListener('blur', save);
    addressInput.addEventListener('blur', save);
    stageInput.addEventListener('blur', save);
    pmInput.addEventListener('blur', save);
    contractorInput.addEventListener('blur', save);
    superintendentInput.addEventListener('blur', save);
    superintendentPhoneInput.addEventListener('blur', save);
    TASK_FIELD_KEYS.forEach(function (k) { task2[k].addEventListener('blur', save); task3[k].addEventListener('blur', save); });

    // Color is admin-only — anyone signed in can fill out the rest of a
    // day's schedule entry, but only an admin can pick/change its color.
    var colorDisabled = disableControls || !canEdit;
    var colorRow = document.createElement('div');
    colorRow.className = 'calendar-color-row';
    var colorLabel = document.createElement('span');
    colorLabel.className = 'calendar-color-row-label';
    colorLabel.textContent = 'Color';
    colorRow.appendChild(colorLabel);
    var colorDots = {};
    DAY_COLOR_KEYS.forEach(function (key) {
      var dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'calendar-color-dot';
      dot.title = key.charAt(0).toUpperCase() + key.slice(1);
      dot.style.background = colorForKey(key).border;
      dot.disabled = colorDisabled;
      dot.addEventListener('click', function () {
        currentColor = (currentColor === key) ? '' : key;
        DAY_COLOR_KEYS.forEach(function (k) { colorDots[k].classList.toggle('is-selected', currentColor === k); });
        save();
      });
      colorDots[key] = dot;
      colorRow.appendChild(dot);
    });
    DAY_COLOR_KEYS.forEach(function (k) { colorDots[k].classList.toggle('is-selected', currentColor === k); });

    // "Off" (job foreman not at work that day) is admin-only, same as
    // color - sits at the end of the color chart, small like the dots.
    // Toggling it saves immediately (shows the black X on the calendar
    // grid right away) and is also carried along by the repeat "Apply"
    // below so an admin can mark a whole date range off at once.
    var offBtn = document.createElement('button');
    offBtn.type = 'button';
    offBtn.className = 'calendar-off-btn';
    offBtn.textContent = 'Off';
    offBtn.title = 'Mark this day off (job foreman not at work)';
    offBtn.disabled = colorDisabled;
    if (currentOff) offBtn.classList.add('is-marked-off');
    offBtn.addEventListener('click', function () {
      currentOff = !currentOff;
      offBtn.classList.toggle('is-marked-off', currentOff);
      save();
    });
    colorRow.appendChild(offBtn);

    // "Holiday" is a separate, admin-only manual mark (green X) — it does
    // NOT auto-set itself from the US holiday list above; an admin picks
    // which days actually get treated as a company holiday. Same toggle
    // pattern as Off: saves immediately, carried along by "Apply".
    var holidayBtn = document.createElement('button');
    holidayBtn.type = 'button';
    holidayBtn.className = 'calendar-holiday-btn';
    holidayBtn.textContent = 'Holiday';
    holidayBtn.title = 'Mark this day as a company holiday';
    holidayBtn.disabled = colorDisabled;
    if (currentHoliday) holidayBtn.classList.add('is-marked-holiday');
    holidayBtn.addEventListener('click', function () {
      currentHoliday = !currentHoliday;
      holidayBtn.classList.toggle('is-marked-holiday', currentHoliday);
      save();
    });
    colorRow.appendChild(holidayBtn);
    editor.appendChild(colorRow);

    var clearBtn = document.createElement('button');
    clearBtn.type = 'button';
    clearBtn.className = 'calendar-back-btn';
    clearBtn.textContent = 'Clear this day';
    clearBtn.disabled = disableControls;
    clearBtn.addEventListener('click', function () {
      jobNameInput.value = ''; poInput.value = ''; addressInput.value = ''; stageInput.value = '';
      pmInput.value = ''; contractorInput.value = ''; superintendentInput.value = ''; superintendentPhoneInput.value = '';
      TASK_FIELD_KEYS.forEach(function (k) { task2[k].value = ''; task3[k].value = ''; });
      currentColor = '';
      currentOff = false;
      currentHoliday = false;
      DAY_COLOR_KEYS.forEach(function (k) { colorDots[k].classList.remove('is-selected'); });
      offBtn.classList.remove('is-marked-off');
      holidayBtn.classList.remove('is-marked-holiday');
      save();
    });
    editor.appendChild(clearBtn);

    var repeatRow = document.createElement('div');
    repeatRow.className = 'calendar-repeat-row';
    var repeatLabel = document.createElement('span');
    repeatLabel.textContent = 'Copy this entry through:';
    repeatRow.appendChild(repeatLabel);
    var repeatInput = document.createElement('input');
    repeatInput.type = 'date';
    repeatInput.min = dk;
    repeatInput.value = dk; // Fix: without an explicit value, iOS Safari's
                            // native date wheel opens on today's date
                            // instead of the day being edited.
    repeatInput.disabled = disableControls;
    repeatRow.appendChild(repeatInput);
    var applyBtn = document.createElement('button');
    applyBtn.type = 'button';
    applyBtn.className = 'calendar-back-btn';
    applyBtn.textContent = 'Apply';
    applyBtn.disabled = disableControls;
    editor.appendChild(repeatRow);

    var note = document.createElement('div');
    note.className = 'calendar-repeat-note';
    note.textContent = calendarRepeatNote;

    applyBtn.addEventListener('click', function () {
      if (!repeatInput.value) return;
      var ep = repeatInput.value.split('-');
      var endDate = new Date(parseInt(ep[0], 10), parseInt(ep[1], 10) - 1, parseInt(ep[2], 10));
      if (endDate < date) return;
      var values = { jobName: jobNameInput.value, po: poInput.value, address: addressInput.value, stage: stageInput.value, pm: pmInput.value, contractor: contractorInput.value, superintendent: superintendentInput.value, superintendentPhone: superintendentPhoneInput.value, task2: readTask(task2), task3: readTask(task3), color: currentColor, off: currentOff, holiday: currentHoliday };
      var count = 0;
      var cur = date;
      while (cur <= endDate) {
        // Skip Saturdays (6) and Sundays (0) - weekends are never
        // auto-applied by a multi-day action; added manually only when needed.
        var dow = cur.getDay();
        if (dow !== 0 && dow !== 6) {
          saveScheduleEntry(personKey, dateKey(cur), values);
          count++;
        }
        cur = addDays(cur, 1);
      }
      calendarRepeatNote = 'Applied to ' + count + ' day' + (count === 1 ? '' : 's') + ' (weekends skipped).';
      note.textContent = calendarRepeatNote;
      renderCalendarGrid(personKey, disableControls);
    });
    repeatRow.appendChild(applyBtn);
    editor.appendChild(note);

    // Bulk color-only apply: lets an admin (re)color a range of days -
    // including days that already have different job data from each
    // other - without touching any of that job data. This is separate
    // from "Copy this entry through" above, which overwrites every
    // field (job data, off, holiday) on each day in the range. Reuses
    // the single "Color" swatch above (currentColor) rather than its
    // own duplicate set of dots - pick the color there, pick a date
    // through here, then Apply Color.
    var colorRangeRow = document.createElement('div');
    colorRangeRow.className = 'calendar-repeat-row';
    var colorRangeLabel = document.createElement('span');
    colorRangeLabel.textContent = 'Apply selected color through:';
    colorRangeRow.appendChild(colorRangeLabel);
    var colorRangeInput = document.createElement('input');
    colorRangeInput.type = 'date';
    colorRangeInput.min = dk;
    colorRangeInput.value = dk;
    colorRangeInput.disabled = colorDisabled;
    colorRangeRow.appendChild(colorRangeInput);
    var applyColorBtn = document.createElement('button');
    applyColorBtn.type = 'button';
    applyColorBtn.className = 'calendar-back-btn';
    applyColorBtn.textContent = 'Apply Color';
    applyColorBtn.disabled = colorDisabled;
    colorRangeRow.appendChild(applyColorBtn);
    editor.appendChild(colorRangeRow);

    var colorRangeNote = document.createElement('div');
    colorRangeNote.className = 'calendar-repeat-note';
    editor.appendChild(colorRangeNote);

    applyColorBtn.addEventListener('click', function () {
      if (!colorRangeInput.value) return;
      var cp = colorRangeInput.value.split('-');
      var colorEndDate = new Date(parseInt(cp[0], 10), parseInt(cp[1], 10) - 1, parseInt(cp[2], 10));
      if (colorEndDate < date) return;
      var count = 0;
      var cur = date;
      while (cur <= colorEndDate) {
        // Skip Saturdays (6) and Sundays (0) - weekends are never
        // auto-applied by a multi-day action; added manually only when needed.
        var dow = cur.getDay();
        if (dow !== 0 && dow !== 6) {
          var curDk = dateKey(cur);
          var existing = (scheduleDocsCache[personKey] || {})[curDk] || {};
          saveScheduleEntry(personKey, curDk, {
            jobName: existing.jobName, po: existing.po, address: existing.address, stage: existing.stage,
            pm: existing.pm, contractor: existing.contractor, superintendent: existing.superintendent, superintendentPhone: existing.superintendentPhone,
            task2: existing.task2, task3: existing.task3,
            color: currentColor, off: existing.off === true, holiday: existing.holiday === true
          });
          count++;
        }
        cur = addDays(cur, 1);
      }
      colorRangeNote.textContent = 'Set color on ' + count + ' day' + (count === 1 ? '' : 's') + ' (weekends skipped).';
      renderCalendarGrid(personKey, disableControls);
    });
  }

  function renderProjectsOverlay() {
    if (!projectsOpenSup) return;
    var supKey = projectsOpenSup;
    var disableControls = dbUnavailable;
    els.projectsPersonName.textContent = displayNameForPersonKey(supKey) + ' — Projects';
    els.projectsAddBtn.disabled = disableControls;

    // column names, then one compact data row per project (newest first -

    // scrollable on narrow screens rather than reflowing, so columns stay

    var table = document.createElement('div');

      var empty = document.createElement('div');

      empty.textContent = 'No projects yet.';
      table.appendChild(empty);
    }

    items.forEach(function (item, idx) {
      var row = document.createElement('div');
      row.className = 'project-row';

      function makeProjectField(key, type) {
        var input = document.createElement('input');
        input.className = 'project-cell-input';
        input.type = type || 'text';
        if (type !== 'date') input.maxLength = 80;
        input.value = item[key];
        input.disabled = disableControls;
        input.addEventListener('blur', function () {
          var current = (projectsDocsCache[supKey] || []).slice();
          if (!current[idx]) return;
          var updated = {
            id: current[idx].id,
            job: current[idx].job,
            startDate: current[idx].startDate,
            contractor: current[idx].contractor,
            contact: current[idx].contact,
            contactPhone: current[idx].contactPhone,
            pm: current[idx].pm
          };
          updated[key] = input.value;
          current[idx] = updated;
          saveProjectsList(supKey, current);
        });
        return input;
      }

      row.appendChild(makeProjectField('job', 'text'));
      row.appendChild(makeProjectField('startDate', 'date'));
      row.appendChild(makeProjectField('contractor', 'text'));
      row.appendChild(makeProjectField('contact', 'text'));
      row.appendChild(makeProjectField('contactPhone', 'text'));
      row.appendChild(makeProjectField('pm', 'text'));

      removeBtn.type = 'button';
      removeBtn.className = 'project-remove-btn';
      removeBtn.textContent = 'Remove';
      removeBtn.disabled = disableControls;

        var current = (projectsDocsCache[supKey] || []).slice();
        current.splice(idx, 1);
        saveProjectsList(supKey, current);
      });
      row.appendChild(removeBtn);

      table.appendChild(row);
    });

    list.appendChild(table);
  }

  function renderForemen() {

      els.addForemanBtn[supKey].disabled = disableControls;
      var listEl = els.foremanList[supKey];

      var names = state.foremen[supKey] || [];

      if (!names.length) {
        var empty = document.createElement('p');
        empty.className = 'foreman-empty';
        empty.textContent = loaded ? 'No Job Foremen yet.' : 'Loading…';
        listEl.appendChild(empty);
      } else {
        names.forEach(function (name) {
          var personKey = 'foreman:' + supKey + ':' + name;

          var entryWrap = document.createElement('div');
          entryWrap.className = 'foreman-entry';

          var box = document.createElement('div');
          box.className = 'foreman-box foreman-box-' + supKey;
          var nameSpan = document.createElement('span');
          nameSpan.className = 'foreman-name-text';
          nameSpan.textContent = name;
          box.appendChild(nameSpan);

          var scheduleBtn = document.createElement('button');
          scheduleBtn.type = 'button';
          scheduleBtn.className = 'schedule-toggle-btn';
          scheduleBtn.textContent = 'Schedule';
          scheduleBtn.disabled = dbUnavailable;
          scheduleBtn.addEventListener('click', function () { openCalendarView(personKey); });
          box.appendChild(scheduleBtn);

          entryWrap.appendChild(box);
          listEl.appendChild(entryWrap);
        });
      }
    });
  }

  var DATETIME_DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

  function renderDateTimeBar() {
    var now = new Date();
    var dateStr = (now.getMonth() + 1) + '/' + now.getDate() + '/' + now.getFullYear();
    var h = now.getHours();
    var ampm = h >= 12 ? 'PM' : 'AM';
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    var clockStr = h12 + ':' + pad2(now.getMinutes()) + ':' + pad2(now.getSeconds()) + ' ' + ampm;
    var dateEls = document.querySelectorAll('.datetime-date');
    for (var i = 0; i < dateEls.length; i++) dateEls[i].textContent = dateStr;
    var clockEls = document.querySelectorAll('.datetime-clock');
    for (var j = 0; j < clockEls.length; j++) clockEls[j].textContent = clockStr;
  }

    els.projectsAddBtn.addEventListener('click', function () {

      current.unshift({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
        job: '', startDate: '', contractor: '', contact: '', contactPhone: '', pm: ''
      });
      saveProjectsList(projectsOpenSup, current);
    });
  }

    // ---------------- Admin-only name updates (console-only, no UI control) ----------------
    // The leadership name fields above are permanently disabled (see
    // syncCrewInputs) so nobody can edit them by clicking in — on purpose.
    // Jonathan asks Claude to change a name, and Claude runs this from the
    // browser console while signed in as an admin. Not linked from any
    // button or menu.
    var LEADERSHIP_NAME_KEYS = ['sup1Name', 'sup2Name', 'sup3Name', 'sup4Name', 'sup5Name', 'sup6Name', 'sup7Name', 'hvac1Name', 'hvac2Name', 'hvac3Name', 'hvac4Name'];
    window.__fabSetLeadershipName = function (which, value) {
      if (LEADERSHIP_NAME_KEYS.indexOf(which) === -1) {
        return Promise.reject(new Error('Unknown field "' + which + '". Valid: ' + LEADERSHIP_NAME_KEYS.join(', ')));
      }
      if (!docRef) {
        return Promise.reject(new Error('Board not loaded yet — try again in a moment.'));
      }
      var fallback = SUP_FALLBACK[which];
      var v = String(value || '').trim().slice(0, 40) || fallback;
      state[which] = v;
      render();
      var patch = {}; patch[which] = v;
      lastWriteError = '';
      return authReady.then(function () {
        return enqueueWrite(function () {
          return updateDoc(docRef, patch).catch(function (err) {
            handleWriteError(err, { revertName: which });
            throw err;
          });
        });
      });
    };
    window.__fabGetLeadershipNames = function () {
      var out = {};
      LEADERSHIP_NAME_KEYS.forEach(function (k) { out[k] = state[k]; });
      return out;
    };

    // Job Foremen add/remove is locked in the UI the same way (see
    // renderForemen) — these are the console-only equivalents.
    window.__fabAddForeman = function (supKey, name) {
      if (SUP_KEYS.indexOf(supKey) === -1) {
        return Promise.reject(new Error('Unknown supervisor key "' + supKey + '". Valid: ' + SUP_KEYS.join(', ')));
      }
      if (!docRef) {
        return Promise.reject(new Error('Board not loaded yet — try again in a moment.'));
      }
      var v = String(name || '').trim().slice(0, 40);
      if (!v) {
        return Promise.reject(new Error('Name cannot be empty.'));
      }
      var list = state.foremen[supKey] || [];
      if (list.indexOf(v) !== -1) {
        return Promise.reject(new Error(v + ' is already listed under this supervisor.'));
      }
      var merged = cloneForemen(state.foremen);
      merged[supKey] = list.concat([v]);
      lastWriteError = '';
      return authReady.then(function () {
        return enqueueWrite(function () {
          return updateDoc(docRef, { foremen: merged }).catch(function (err) {
            handleWriteError(err);
            throw err;
          });
        });
      });
    };
    window.__fabRemoveForeman = function (supKey, name) {
      if (SUP_KEYS.indexOf(supKey) === -1) {
        return Promise.reject(new Error('Unknown supervisor key "' + supKey + '". Valid: ' + SUP_KEYS.join(', ')));
      }
      if (!docRef) {
        return Promise.reject(new Error('Board not loaded yet — try again in a moment.'));
      }
      var merged = cloneForemen(state.foremen);
      merged[supKey] = (merged[supKey] || []).filter(function (n) { return n !== name; });
      lastWriteError = '';
      return authReady.then(function () {
        return enqueueWrite(function () {
          return updateDoc(docRef, { foremen: merged }).catch(function (err) {
            handleWriteError(err);
            throw err;
          });
        });
      });
    };
    window.__fabGetForemen = function () {
      return cloneForemen(state.foremen);
    };

    // Admin list (admins/config, a separate doc from board/week1) is not
    // exposed in the UI at all — no sign-in screen or settings panel ever
    // shows or edits who's an admin. Same "Claude runs this from the
    // console on Jonathan's explicit request" pattern as the leadership
    // names and Job Foremen above. Always read-modify-write the whole
    // emails array (never overwrite it wholesale) so an admin add/remove
    // can never silently drop someone else who's already on the list.
    window.__fabAddAdmin = function (email) {
      var v = String(email || '').trim().toLowerCase();
      if (!PLUMCORE_EMAIL_RE.test(v)) {
        return Promise.reject(new Error('Must be a @plumcore.com email.'));
      }
      var adminsRef = doc(firestoreDb, 'admins', 'config');
      return getDoc(adminsRef).then(function (snap) {
        var emails = (snap.exists() && Array.isArray(snap.data().emails)) ? snap.data().emails.slice() : [];
        if (emails.some(function (e) { return typeof e === 'string' && e.toLowerCase() === v; })) {
          throw new Error(v + ' is already an admin.');
        }
        emails.push(v);
        return setDoc(adminsRef, { emails: emails }, { merge: true }).then(function () { return emails; });
      });
    };
    window.__fabRemoveAdmin = function (email) {
      var v = String(email || '').trim().toLowerCase();
      var adminsRef = doc(firestoreDb, 'admins', 'config');
      return getDoc(adminsRef).then(function (snap) {
        var emails = (snap.exists() && Array.isArray(snap.data().emails)) ? snap.data().emails.slice() : [];
        var filtered = emails.filter(function (e) { return typeof e === 'string' && e.toLowerCase() !== v; });
        return setDoc(adminsRef, { emails: filtered }, { merge: true }).then(function () { return filtered; });
      });
    };
    window.__fabGetAdmins = function () {
      return getDoc(doc(firestoreDb, 'admins', 'config')).then(function (snap) {
        return (snap.exists() && Array.isArray(snap.data().emails)) ? snap.data().emails.slice() : [];
      });
    };

    // Deliberate, explicit escape hatch for the one legitimate case where
    // board/week1 really doesn't exist yet (a brand-new deployment). Unlike
    // the old auto-recreate behavior this replaced, it does nothing on its
    // own — it only runs when Claude calls it by hand with real values, and
    // it refuses outright if the doc turns out to already exist, so it can
    // never be the thing that silently overwrites real data again.
    window.__fabForceInitBoard = function (values) {
      if (!docRef) {
        return Promise.reject(new Error('Board not loaded yet — try again in a moment.'));
      }
      values = values || {};
      return getDoc(docRef).then(function (snap) {
        if (snap.exists()) {
          throw new Error('Refusing: board/week1 already exists. Use __fabSetLeadershipName / __fabAddForeman to edit it instead.');
        }
        var payload = {
          sup1Name: typeof values.sup1Name === 'string' && values.sup1Name ? values.sup1Name : SUP_FALLBACK.sup1Name,
          sup2Name: typeof values.sup2Name === 'string' && values.sup2Name ? values.sup2Name : SUP_FALLBACK.sup2Name,
          sup3Name: typeof values.sup3Name === 'string' && values.sup3Name ? values.sup3Name : SUP_FALLBACK.sup3Name,
          sup4Name: typeof values.sup4Name === 'string' && values.sup4Name ? values.sup4Name : SUP_FALLBACK.sup4Name,
          sup5Name: typeof values.sup5Name === 'string' && values.sup5Name ? values.sup5Name : SUP_FALLBACK.sup5Name,
          sup6Name: typeof values.sup6Name === 'string' && values.sup6Name ? values.sup6Name : SUP_FALLBACK.sup6Name,
          sup7Name: typeof values.sup7Name === 'string' && values.sup7Name ? values.sup7Name : SUP_FALLBACK.sup7Name,
          hvac1Name: typeof values.hvac1Name === 'string' && values.hvac1Name ? values.hvac1Name : SUP_FALLBACK.hvac1Name,
          hvac2Name: typeof values.hvac2Name === 'string' && values.hvac2Name ? values.hvac2Name : SUP_FALLBACK.hvac2Name,
          hvac3Name: typeof values.hvac3Name === 'string' && values.hvac3Name ? values.hvac3Name : SUP_FALLBACK.hvac3Name,
          hvac4Name: typeof values.hvac4Name === 'string' && values.hvac4Name ? values.hvac4Name : SUP_FALLBACK.hvac4Name,
          foremen: (values.foremen && typeof values.foremen === 'object') ? {
            sup2: Array.isArray(values.foremen.sup2) ? values.foremen.sup2.filter(function (t) { return typeof t === 'string' && t; }) : [],
            sup3: Array.isArray(values.foremen.sup3) ? values.foremen.sup3.filter(function (t) { return typeof t === 'string' && t; }) : []
          } : { sup2: [], sup3: [] }
        };
        return setDoc(docRef, payload);
      });
    };

    wireStaticControls();
    renderDateTimeBar();
    setInterval(renderDateTimeBar, 1000);
    boot();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
