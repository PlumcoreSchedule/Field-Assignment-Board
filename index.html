<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Assignment Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
  :root {
    --color-canvas: #FAF5EC;
    --color-surface: #FFFFFF;
    --color-surface-alt: #F3ECDF;
    --color-border: #E1D6C2;
    --color-border-strong: #CBBB9C;
    --color-ink: #2B241C;
    --color-ink-muted: #6B5E4C;
    --color-accent: #B85C2E;
    --color-accent-ink: #FFFFFF;
    --color-accent-soft: #F0DCC9;
    --color-danger: #A8402A;
    --color-danger-soft: #F4DCD3;
    --color-sup1: #B33A2E;
    --color-sup1-ink: #FFFFFF;
    --color-sup2: #B8862B;
    --color-sup2-ink: #241C0E;
    --color-sup3: #3E7C4A;
    --color-sup3-ink: #FFFFFF;
    --color-sup4: #2F5FA8;
    --color-sup4-ink: #FFFFFF;
    --color-sup5: #1E5631;
    --color-sup5-ink: #FFFFFF;
    --color-sup6: #16324F;
    --color-sup6-ink: #FFFFFF;
    --color-sup7: #C1600A;
    --color-sup7-ink: #FFFFFF;
    --color-empty-bg: #F3ECDF;
    --color-empty-border: #D8CBAF;
    --color-focus: #1F6F6F;
    --shadow-sm: 0 1px 2px rgba(43, 36, 28, 0.10);
    --shadow-md: 0 6px 18px rgba(43, 36, 28, 0.12);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 18px;

    --font-display: 'Fraunces', Georgia, 'Iowan Old Style', serif;
    --font-body: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;

    --text-xs: 0.72rem;
    --text-sm: 0.82rem;
    --text-base: 0.94rem;
    --text-md: 1.05rem;
    --text-lg: 1.3rem;
    --text-xl: 1.85rem;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --color-canvas: #1C1712;
      --color-surface: #241E17;
      --color-surface-alt: #2C251C;
      --color-border: #40372A;
      --color-border-strong: #574A37;
      --color-ink: #F1E8DA;
      --color-ink-muted: #B7A98F;
      --color-accent: #E2894F;
      --color-accent-ink: #241004;
      --color-accent-soft: #3E2E1E;
      --color-danger: #E2694A;
      --color-danger-soft: #3C241C;
      --color-sup1: #E2776B;
      --color-sup1-ink: #2A0D08;
      --color-sup2: #DDAA4C;
      --color-sup2-ink: #241A05;
      --color-sup3: #6FBF7B;
      --color-sup3-ink: #0C2210;
      --color-sup4: #7FB2E8;
      --color-sup4-ink: #0B2036;
      --color-sup5: #4FA868;
      --color-sup5-ink: #0F2A18;
      --color-sup6: #5B8FC7;
      --color-sup6-ink: #0A1B2E;
      --color-sup7: #E8985A;
      --color-sup7-ink: #241004;
      --color-empty-bg: #2C251C;
      --color-empty-border: #443A2B;
      --color-focus: #7ED0CA;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 8px 22px rgba(0, 0, 0, 0.45);
    }
  }

  :root[data-theme="dark"] {
    --color-canvas: #1C1712;
    --color-surface: #241E17;
    --color-surface-alt: #2C251C;
    --color-border: #40372A;
    --color-border-strong: #574A37;
    --color-ink: #F1E8DA;
    --color-ink-muted: #B7A98F;
    --color-accent: #E2894F;
    --color-accent-ink: #241004;
    --color-accent-soft: #3E2E1E;
    --color-danger: #E2694A;
    --color-danger-soft: #3C241C;
    --color-sup1: #E2776B;
    --color-sup1-ink: #2A0D08;
    --color-sup2: #DDAA4C;
    --color-sup2-ink: #241A05;
    --color-sup3: #6FBF7B;
    --color-sup3-ink: #0C2210;
    --color-sup4: #7FB2E8;
    --color-sup4-ink: #0B2036;
    --color-sup5: #4FA868;
    --color-sup5-ink: #0F2A18;
    --color-sup6: #5B8FC7;
    --color-sup6-ink: #0A1B2E;
    --color-sup7: #E8985A;
    --color-sup7-ink: #241004;
    --color-empty-bg: #2C251C;
    --color-empty-border: #443A2B;
    --color-focus: #7ED0CA;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 8px 22px rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--color-canvas);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: var(--text-base);
    line-height: 1.45;
    padding-inline: 16px;
    padding-block: 12px 28px;
  }

  h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }

  .page { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  /* ---------- header ---------- */
  .topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--color-canvas);
    padding-block: 10px;
    margin-inline: -16px;
    padding-inline: 16px;
    border-bottom: 1px solid var(--color-border);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
  }
  .topbar-center-logo {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
  }
  @media (max-width: 720px) {
    .topbar-center-logo { display: none; }
  }
  .topbar-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .brand-mark {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color-accent);
    font-weight: 600;
  }
  .page-title { font-size: var(--text-xl); font-weight: 600; color: var(--color-ink); }
  .title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .brand-logo { height: 60px; width: auto; display: block; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .brand-logo {
      background: #FFFFFF;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
    }
  }
  :root[data-theme="dark"] .brand-logo {
    background: #FFFFFF;
    padding: 4px 8px;
    border-radius: var(--radius-sm);
  }
  .topbar-right { display: flex; flex-direction: column; align-items: stretch; gap: 8px; flex-wrap: wrap; }

  .btn {
    font-family: var(--font-body);
    font-size: var(--text-sm);
    font-weight: 600;
    border-radius: var(--radius-sm);
    padding: 9px 14px;
    border: 1px solid transparent;
    cursor: pointer;
    min-height: 40px;
    transition: filter 0.12s ease, transform 0.05s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
  .btn:disabled { cursor: not-allowed; opacity: 0.5; filter: none; }

  .btn-sm { min-height: 34px; padding: 6px 12px; font-size: var(--text-xs); }

  .btn-primary { background: var(--color-accent); color: var(--color-accent-ink); }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.06); }

  .btn-ghost-danger {
    background: transparent;
    color: var(--color-danger);
    border-color: var(--color-danger);
  }
  .btn-ghost-danger:hover:not(:disabled) { background: var(--color-danger-soft); }

  /* ---------- status banner ---------- */
  .status-banner {
    border-radius: var(--radius-md);
    padding: 10px 14px;
    font-size: var(--text-sm);
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--color-border);
  }
  .status-banner[hidden] {
    display: none;
  }
  .status-banner::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex: none;
    background: currentColor;
  }
  .status-info { background: var(--color-surface-alt); color: var(--color-ink-muted); border-color: var(--color-border); }
  .status-info::before { animation: pulse 1.6s ease-in-out infinite; }
  .status-warning { background: var(--color-accent-soft); color: var(--color-accent); border-color: var(--color-accent); }
  .status-error { background: var(--color-danger-soft); color: var(--color-danger); border-color: var(--color-danger); }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .status-info::before { animation: none; }
    * { transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
  }

  /* ---------- org chart: crew ---------- */
  .crew {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .crew-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .swatch {
    width: 22px;
    height: 22px;
    border-radius: 7px;
    flex: none;
    border: 1px solid rgba(0,0,0,0.15);
  }
  .swatch-sup1 { background: var(--color-sup1); }
  .swatch-sup2 { background: var(--color-sup2); }
  .swatch-sup3 { background: var(--color-sup3); }
  .swatch-sup4 { background: var(--color-sup4); }
  .swatch-sup5 { background: var(--color-sup5); }
  .swatch-sup6 { background: var(--color-sup6); }
  .swatch-sup7 { background: var(--color-sup7); }

  .crew-field { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
  .field-label {
    font-size: var(--text-xs);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--color-ink-muted);
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .crew-input {
    font-family: var(--font-body);
    font-size: var(--text-md);
    font-weight: 600;
    color: var(--color-ink);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 2px 0;
    min-width: 0;
    width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .crew-input:hover:not(:disabled) { border-bottom-color: var(--color-border-strong); }
  .crew-input:focus { outline: none; border-bottom-color: var(--color-focus); }
  .crew-input:disabled { color: var(--color-ink-muted); }

  .crew-lead-card {
    width: 100%;
    flex: 0 0 auto;
    padding: 9px 12px;
  }
  .crew-lead-card .swatch { width: 18px; height: 18px; }
  .crew-lead-card .crew-input { font-size: var(--text-sm); }

  .crew-sub-row {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-left: 14px;
    padding-left: 16px;
    border-left: 3px solid var(--color-border-strong);
  }
  .supervisor-branch {
    flex: 1 1 220px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  .branch-stack {
    flex: 1 1 220px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 0;
  }
  .branch-stack .supervisor-branch { flex: none; }
  .supervisor-branch .crew-card {
    padding: 9px 12px;
  }
  .supervisor-branch .swatch { width: 18px; height: 18px; }
  .supervisor-branch .crew-input { font-size: var(--text-sm); }

  /* ---------- lead row: supervisors + datetime, side by side ---------- */
  .lead-row {
    display: flex;
    flex-wrap: wrap;
    align-items: stretch;
    gap: 14px;
  }
  .lead-row .crew-lead-card { flex: 1 1 320px; width: auto; }
  .lead-row > .supervisor-branch { flex: 1 1 240px; }
  .lead-row .branch-stack { flex: 1 1 240px; }
  .lead-row .branch-stack .supervisor-branch { flex: none; }

  /* ---------- slab manager + plumbing foreman, left-aligned under supervisors ---------- */
  .crew-left-row {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-left: 14px;
    padding-left: 16px;
    border-left: 3px solid var(--color-border-strong);
  }
  .crew-left-row .supervisor-branch { flex: 0 1 300px; }

  /* ---------- installer: matches the width of the slab manager + plumbing foreman row above it ---------- */
  .installer-row { flex: 0 0 auto; width: 316px; max-width: 100%; margin-left: 14px; padding-left: 16px; }
  .installer-row .crew-card { width: 100%; }

  /* ---------- job foremen ---------- */
  .foreman-column {
    margin-left: 12px;
    padding-left: 14px;
    border-left: 2px solid var(--color-border);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .foreman-list { display: flex; flex-direction: column; gap: 6px; }
  .foreman-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-left: 4px solid var(--color-border-strong);
    border-radius: var(--radius-sm);
    padding: 7px 10px;
    box-shadow: var(--shadow-sm);
  }
  .foreman-box-sup2 { border-left-color: var(--color-sup2); }
  .foreman-box-sup3 { border-left-color: var(--color-sup3); }
  .foreman-box-sup4 { border-left-color: var(--color-sup4); }
  .foreman-box-sup7 { border-left-color: var(--color-sup7); }
  .foreman-name-text { font-weight: 600; font-size: var(--text-sm); overflow-wrap: anywhere; }
  .foreman-empty {
    font-size: var(--text-xs);
    color: var(--color-ink-muted);
    font-style: italic;
    padding: 4px 2px;
  }

  .add-foreman-form { display: none; }
  .add-foreman-form input[type="text"] {
    font-family: var(--font-body);
    font-size: var(--text-sm);
    border: 1px solid var(--color-border-strong);
    background: var(--color-surface);
    color: var(--color-ink);
    border-radius: var(--radius-sm);
    padding: 7px 9px;
    min-height: 34px;
    width: 100%;
    max-width: 220px;
  }
  .add-foreman-form input[type="text"]:focus { outline: 2px solid var(--color-focus); outline-offset: 1px; }
  .add-foreman-form input[type="text"]:disabled { opacity: 0.55; }
  .field-error {
    font-size: var(--text-xs);
    color: var(--color-danger);
    margin: 0;
    flex-basis: 100%;
  }

  /* ---------- date & time bar ---------- */
  .datetime-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
    flex-wrap: wrap;
    background: var(--color-surface-alt);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 8px 12px;
  }
  .datetime-date {
    font-family: var(--font-body);
    font-size: var(--text-sm);
    font-weight: 600;
    color: var(--color-ink);
  }
  .datetime-clock {
    font-family: var(--font-mono);
    font-size: var(--text-md);
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--color-accent);
  }
  .datetime-bar-compact {
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 2px;
    padding: 6px 10px;
  }
  .datetime-bar-compact .datetime-date { font-size: var(--text-xs); }
  .datetime-bar-compact .datetime-clock { font-size: var(--text-sm); }

  /* ---------- schedule (per-person forecast) ---------- */
  .foreman-entry { display: flex; flex-direction: column; gap: 6px; }
  .schedule-toggle-btn {
    flex: none;
    font-family: var(--font-body);
    font-size: var(--text-xs);
    font-weight: 600;
    border-radius: var(--radius-sm);
    padding: 5px 9px;
    min-height: 24px;
    border: 1px solid var(--color-border-strong);
    background: var(--color-surface);
    color: var(--color-ink-muted);
    cursor: pointer;
  }
  .schedule-toggle-btn:hover:not(:disabled) { background: var(--color-accent-soft); color: var(--color-accent); }
  .schedule-toggle-btn.is-open { background: var(--color-accent); color: var(--color-accent-ink); border-color: var(--color-accent); }
  .schedule-toggle-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---------- full-page schedule calendar ---------- */
  .calendar-overlay {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: var(--color-canvas);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .calendar-overlay[hidden] { display: none; }
  .calendar-overlay-header {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    padding: 12px 16px;
  }
  .calendar-back-btn {
    font-family: var(--font-body);
    font-size: var(--text-sm);
    font-weight: 600;
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    min-height: 38px;
    border: 1px solid var(--color-border-strong);
    background: var(--color-surface);
    color: var(--color-ink);
    cursor: pointer;
  }
  .calendar-back-btn:hover:not(:disabled) { background: var(--color-accent-soft); }
  .calendar-back-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .calendar-person-name {
    font-family: var(--font-display);
    font-size: var(--text-lg);
    font-weight: 600;
    color: var(--color-ink);
  }
  .calendar-month-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 16px 6px;
    flex-wrap: wrap;
  }
  .calendar-nav-btn, .calendar-today-btn {
    font-family: var(--font-body);
    font-size: var(--text-sm);
    font-weight: 600;
    border-radius: var(--radius-sm);
    padding: 8px 14px;
    min-height: 38px;
    border: 1px solid var(--color-border-strong);
    background: var(--color-surface);
    color: var(--color-ink);
    cursor: pointer;
  }
  .calendar-nav-btn:hover, .calendar-today-btn:hover { background: var(--color-accent-soft); }
  .calendar-month-label {
    font-family: var(--font-display);
    font-size: var(--text-xl);
    font-weight: 600;
    min-width: 220px;
    text-align: center;
    color: var(--color-ink);
  }
  .calendar-weekday-row, .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    padding: 0 16px;
  }
  .calendar-weekday-row { padding-top: 10px; padding-bottom: 4px; }
  .calendar-weekday-label {
    font-size: var(--text-xs);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--color-ink-muted);
    text-align: center;
  }
  .calendar-grid { padding-bottom: 16px; }
  .calendar-day-cell {
    position: relative;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    background: var(--color-surface);
    min-height: 76px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
  }
  .calendar-day-cell:hover { border-color: var(--color-border-strong); }
  .calendar-day-cell.is-other-month { opacity: 0.45; }
  .calendar-day-cell.is-today { outline: 2px solid var(--color-focus); outline-offset: -2px; }
  .calendar-day-cell.is-selected { border-color: var(--color-accent); border-width: 2px; }
  /* Marked "off" (job foreman not at work): a black X drawn corner-to-corner over the day box. */
  .calendar-day-cell.is-off::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    border-radius: inherit;
    background:
      linear-gradient(to bottom right, transparent calc(50% - 1.5px), #000 calc(50% - 1.5px), #000 calc(50% + 1.5px), transparent calc(50% + 1.5px)),
      linear-gradient(to bottom left, transparent calc(50% - 1.5px), #000 calc(50% - 1.5px), #000 calc(50% + 1.5px), transparent calc(50% + 1.5px));
  }
  .calendar-day-number {
    font-family: var(--font-mono);
    font-size: var(--text-sm);
    font-weight: 600;
    color: var(--color-ink);
  }
  .calendar-day-job {
    font-size: var(--text-xs);
    font-weight: 600;
    padding: 3px 5px;
    border-radius: 4px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .calendar-day-editor {
    margin: 4px 16px 24px;
    background: var(--color-surface-alt);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .calendar-day-editor[hidden] { display: none; }
  .calendar-day-editor-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .calendar-day-editor-title {
    font-family: var(--font-display);

  var SUP_FALLBACK = { sup1Name: 'General Superintendent', sup2Name: 'Supervisor 1', sup3Name: 'Supervisor 2', sup4Name: 'Layout Manager', sup5Name: 'Plumbing Foreman', sup6Name: 'Installer', sup7Name: 'Charlie Cheetum' };

  var state = {
    sup1Name: 'General Superintendent',
    sup2Name: 'Supervisor 1',
    sup3Name: 'Supervisor 2',
    sup4Name: 'Layout Manager',
    sup5Name: 'Plumbing Foreman',
    sup6Name: 'Installer',
    sup7Name: 'Charlie Cheetum',
    foremen: { sup2: [], sup3: [] }
  };
  // Last server-confirmed supervisor names, used to roll back a name
  // edit locally if the write turns out not to be permitted.
  var confirmedNames = { sup1Name: 'General Superintendent', sup2Name: 'Supervisor 1', sup3Name: 'Supervisor 2', sup4Name: 'Layout Manager', sup5Name: 'Plumbing Foreman', sup6Name: 'Installer', sup7Name: 'Charlie Cheetum' };

  var docRef = null;
  var loaded = false;
  var dbUnavailable = false;
  var disconnected = false;
  var canEdit = false;
  var triedInit = false;
  var boardMissing = false;
  var writeChain = Promise.resolve();
  var els = {};
  var currentUser = null;
  var isAdminUser = false;
  var PLUMCORE_EMAIL_RE = /^[^\s@]+@plumcore\.com$/i;
  var AUTH_EMAIL_STORAGE_KEY = 'fab_authEmailForSignIn';
  var authGateMode = 'employee'; // 'employee' (email link) | 'admin' (email + password)
  var authAdminFirstTime = false;
  var nameDebounce = {};
  var scheduleDebounce = {};

  // ---------------- Forecast schedule helpers ----------------
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function dateKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function addDays(d, n) { var r = new Date(d); r.setDate(r.getDate() + n); return r; }
  function firstOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
  var MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var MONTH_NAMES_FULL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  function fmtDayLabel(d) { return DAY_NAMES[d.getDay()] + ', ' + MONTH_NAMES[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); }

  // ---------------- US holidays (computed from the date, shown on every
  // calendar automatically — not stored, not per-person) ----------------
  // Federal holidays plus Halloween (not federal, but requested). Four of
  // these carry a "kind" and get a small animated icon next to their text
  // label: Christmas, Thanksgiving, Independence Day and Halloween. This
  // is separate from the admin-only "Holiday" toggle below, which marks a
  // day with a green X regardless of whether it's a real US holiday.
  function nthWeekdayOfMonth(year, month, weekday, n) {
    var d = new Date(year, month, 1);
    var offset = (weekday - d.getDay() + 7) % 7;
    return new Date(year, month, 1 + offset + (n - 1) * 7);
  }
  function lastWeekdayOfMonth(year, month, weekday) {
    var lastDay = new Date(year, month + 1, 0);
    var offset = (lastDay.getDay() - weekday + 7) % 7;
    return new Date(year, month, lastDay.getDate() - offset);
  }
  var HOLIDAY_ICONS = { christmas: '🎄', thanksgiving: '🦃', july4: '🎆', halloween: '🎃' };
  var usHolidayCache = {};
  function usHolidaysForYear(year) {
    if (usHolidayCache[year]) return usHolidayCache[year];
    var map = {};
    function add(date, name, kind) {
      map[dateKey(date)] = { name: name, kind: kind || null };
    }
    add(new Date(year, 0, 1), "New Year's Day");
    add(nthWeekdayOfMonth(year, 0, 1, 3), 'MLK Jr. Day');
    add(nthWeekdayOfMonth(year, 1, 1, 3), 'Presidents Day');
    add(lastWeekdayOfMonth(year, 4, 1), 'Memorial Day');
    add(new Date(year, 5, 19), 'Juneteenth');
    add(new Date(year, 6, 4), 'Independence Day', 'july4');
    add(nthWeekdayOfMonth(year, 8, 1, 1), 'Labor Day');
    add(nthWeekdayOfMonth(year, 9, 1, 2), 'Columbus Day');
    add(new Date(year, 9, 31), 'Halloween', 'halloween');
    add(new Date(year, 10, 11), 'Veterans Day');
    add(nthWeekdayOfMonth(year, 10, 4, 4), 'Thanksgiving', 'thanksgiving');
    add(new Date(year, 11, 25), 'Christmas', 'christmas');
    usHolidayCache[year] = map;
    return map;
  }
  function holidayForDate(date) {
    return usHolidaysForYear(date.getFullYear())[dateKey(date)] || null;
  }

  // Which person's full-page schedule calendar is currently open (or null),
  // which month it's showing, and which single day (if any) is expanded
  // for editing inside that calendar.
  var calendarOpenPerson = null;
  var calendarViewDate = firstOfMonth(new Date());
  var calendarSelectedDk = null;
  var calendarRepeatNote = '';

  // A day's color is no longer derived automatically from its job name —
  // admins pick one manually from this fixed palette (stored as entry.color,
  // one of these keys, or '' for none).
  var DAY_COLOR_KEYS = ['black', 'red', 'orange', 'yellow', 'green', 'blue', 'purple'];
  var DAY_COLOR_HUES = { red: 0, orange: 28, yellow: 48, green: 140, blue: 213, purple: 275 };
  function colorForKey(key) {
    if (!key || DAY_COLOR_KEYS.indexOf(key) === -1) return null;
    if (key === 'black') return { bg: 'rgba(0, 0, 0, 0.30)', border: '#000000' };
    var hue = DAY_COLOR_HUES[key];
    return { bg: 'hsla(' + hue + ', 55%, 55%, 0.18)', border: 'hsl(' + hue + ', 50%, 45%)' };
  }

  function q(id) { return document.getElementById(id); }

  // Turns "jonathan@plumcore.com" into "Jonathan", "5-8@plumcore.com" into
  // "5 8", etc. — just the human-friendly part before the @, for a
  // cleaner "signed in as" chip than the full email address.
  function displayNameFromEmail(email) {
    var local = String(email || '').split('@')[0];
    var parts = local.split(/[._-]+/).filter(Boolean);
    if (!parts.length) return local;
    return parts.map(function (p) {
      if (/^[0-9]+$/.test(p)) return p;
      return p.charAt(0).toUpperCase() + p.slice(1).toLowerCase();
    }).join(' ');
  }

  function renderSignedInAs(email) {
    var displayName = displayNameFromEmail(email);
    var initial = (displayName.trim().charAt(0) || '?').toUpperCase();
    els.authSignedInAs.innerHTML = '';
    var avatar = document.createElement('span');
    avatar.className = 'authgate-avatar';
    avatar.textContent = initial;
    var nameSpan = document.createElement('span');
    nameSpan.className = 'authgate-signedin-name';
    nameSpan.textContent = displayName;
    var signOutSpan = document.createElement('span');
    signOutSpan.className = 'authgate-signout-label';
    signOutSpan.textContent = 'Sign out';
    els.authSignedInAs.title = email;
    els.authSignedInAs.appendChild(avatar);
    els.authSignedInAs.appendChild(nameSpan);
    els.authSignedInAs.appendChild(signOutSpan);
  }

  function enqueueWrite(fn) {
    writeChain = writeChain.then(fn, fn);
    return writeChain;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function cloneForemen(f) {
    return { sup2: (f.sup2 || []).slice(), sup3: (f.sup3 || []).slice() };
  }

  // Each person's forecast schedule lives in its own "schedules/<slug>"
  // document (not the main board doc), so it can carry a looser write
  // rule: any signed-in viewer can fill it in, while the org chart itself
  // (names, foremen) stays admin-only.
  function slugify(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9_\-.~:@+]/g, '-');
  }

  function cloneDayMap(days) {
    var out = {};
    Object.keys(days || {}).forEach(function (dk) {
      var e = days[dk] || {};
      out[dk] = {
        jobName: typeof e.jobName === 'string' ? e.jobName : '',
        po: typeof e.po === 'string' ? e.po : '',
        address: typeof e.address === 'string' ? e.address : '',
        stage: typeof e.stage === 'string' ? e.stage : '',
        pm: typeof e.pm === 'string' ? e.pm : '',
        contractor: typeof e.contractor === 'string' ? e.contractor : '',
        superintendent: typeof e.superintendent === 'string' ? e.superintendent : '',
        superintendentPhone: typeof e.superintendentPhone === 'string' ? e.superintendentPhone : '',
        color: (typeof e.color === 'string' && DAY_COLOR_KEYS.indexOf(e.color) !== -1) ? e.color : '',
        off: e.off === true,
        holiday: e.holiday === true
      };
    });
    return out;
  }

  var dbHandle = null;
  var scheduleDocsCache = {};
  var scheduleSubs = {};
  var authReadyResolve = null;
  var authReady = new Promise(function (res) { authReadyResolve = res; });
  var scheduleReadyResolvers = {};
  var scheduleReadyPromises = {};
  var lastWriteError = '';

  function ensureScheduleSub(personKey) {
    if (scheduleSubs[personKey]) return;
    scheduleSubs[personKey] = true; // claim immediately so a second call can't double-queue
    scheduleReadyPromises[personKey] = new Promise(function (res) {
      scheduleReadyResolvers[personKey] = res;
    });
    authReady.then(function () {
      var ref = doc(dbHandle, 'schedules', slugify(personKey));
      scheduleSubs[personKey] = onSnapshot(ref, function (snap) {
        scheduleDocsCache[personKey] = snap.exists() ? cloneDayMap(snap.data()) : {};
        if (scheduleReadyResolvers[personKey]) { scheduleReadyResolvers[personKey](); scheduleReadyResolvers[personKey] = null; }
        render();
      }, function () {
        scheduleDocsCache[personKey] = scheduleDocsCache[personKey] || {};
        if (scheduleReadyResolvers[personKey]) { scheduleReadyResolvers[personKey](); scheduleReadyResolvers[personKey] = null; }
        render();
      });
    });
  }

  // ---------------- Per-supervisor project list (Jimmy/Chris "Projects" tab) ----------------
  // Same shape as the schedules/* sync above, but the whole list lives in one
  // doc per supervisor (projects/sup2, projects/sup3) as an `items` array —
  // there's no per-day keying to worry about, so writes just replace the
  // whole array. Same looser "any signed-in user can edit" rule as Schedule.
  function cloneProjectsList(items) {
    return (Array.isArray(items) ? items : []).map(function (it) {
      it = it || {};
      return {
        id: (typeof it.id === 'string' && it.id) ? it.id : (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)),
        job: typeof it.job === 'string' ? it.job : '',
        startDate: typeof it.startDate === 'string' ? it.startDate : '',
        contractor: typeof it.contractor === 'string' ? it.contractor : '',
        contact: typeof it.contact === 'string' ? it.contact : '',
        pm: typeof it.pm === 'string' ? it.pm : ''
      };
    });
  }

  var projectsDocsCache = {};
  var projectsSubs = {};
  var projectsReadyResolvers = {};
  var projectsReadyPromises = {};

  function ensureProjectsSub(supKey) {
    if (projectsSubs[supKey]) return;
    projectsSubs[supKey] = true;
    projectsReadyPromises[supKey] = new Promise(function (res) {
      projectsReadyResolvers[supKey] = res;
    });
    authReady.then(function () {
      var ref = doc(dbHandle, 'projects', slugify(supKey));
      projectsSubs[supKey] = onSnapshot(ref, function (snap) {
        projectsDocsCache[supKey] = snap.exists() ? cloneProjectsList(snap.data().items) : [];
        if (projectsReadyResolvers[supKey]) { projectsReadyResolvers[supKey](); projectsReadyResolvers[supKey] = null; }
        render();
      }, function () {
        projectsDocsCache[supKey] = projectsDocsCache[supKey] || [];
        if (projectsReadyResolvers[supKey]) { projectsReadyResolvers[supKey](); projectsReadyResolvers[supKey] = null; }
        render();
      });
    });
  }

  function saveProjectsList(supKey, items) {
    var readyPromise = projectsReadyPromises[supKey];
    if (!dbHandle || !readyPromise) return;
    var cleaned = cloneProjectsList(items);
    readyPromise.then(function () {
      var ref = doc(dbHandle, 'projects', slugify(supKey));
      projectsDocsCache[supKey] = cleaned;
      lastWriteError = '';
      render();
      enqueueWrite(function () {
        return setDoc(ref, { items: cleaned }, { merge: true }).catch(function (err) { handleProjectsWriteError(err); });
      });
    });
  }

  function handleProjectsWriteError(err) {
    if (err && err.code === 'unauthenticated') {
      disconnected = true;
    } else if (err && err.code === 'permission-denied') {
      lastWriteError = "Couldn't save this project list — you may not have edit access.";
    } else if (err) {
      lastWriteError = "Couldn't save this project list. Try again.";
    }
    render();
  }

  function inputForName(which) {
    if (which === 'sup1Name') return els.sup1Input;
    if (which === 'sup2Name') return els.sup2Input;
    if (which === 'sup3Name') return els.sup3Input;
    if (which === 'sup4Name') return els.sup4Input;
    if (which === 'sup5Name') return els.sup5Input;
    if (which === 'sup7Name') return els.sup7Input;
    return els.sup6Input;
  }

  function handleWriteError(err, opts) {
    opts = opts || {};
    if (err && err.code === 'permission-denied') {
      canEdit = false;
      if (opts.revertName) {
        state[opts.revertName] = confirmedNames[opts.revertName];
      }
    } else if (err && err.code === 'unauthenticated') {
      canEdit = false;
      disconnected = true;
    } else if (err && err.code === 'not-found') {
      triedInit = false;
      lastWriteError = "Couldn't save — the board record is missing. Reload the page.";
    } else if (err) {
      lastWriteError = "Couldn't save your change. Try again.";
    }
    // unavailable / resource-exhausted / deadline-exceeded / aborted:
    // transient — leave canEdit as-is.
    render();
  }

  // ---------------- Sign-in gate (email link, @plumcore.com only) ----------------
  function setGateMessage(text, isError) {
    els.authGateMsg.textContent = text || '';
    els.authGateMsg.className = 'authgate-msg' + (text ? (isError ? ' is-error' : ' is-info') : '');
  }

  function setGateBusy(busy) {
    els.authEmailInput.disabled = busy;
    els.authPasswordInput.disabled = busy;
    els.authSendBtn.disabled = busy;
  }

  function renderGateMode() {
    var isAdminMode = authGateMode === 'admin';
    els.authPasswordInput.hidden = !isAdminMode;
    els.authFirstTimeToggle.hidden = !isAdminMode;
    if (isAdminMode) {
      els.authGateSub.textContent = 'Admin sign-in. Enter your @plumcore.com email and password.';
      els.authModeToggle.textContent = 'Not an admin? Use email link instead';
      els.authFirstTimeToggle.textContent = authAdminFirstTime
        ? 'Already have a password? Sign in instead'
        : 'First time? Create your password instead';
      els.authSendBtn.textContent = authAdminFirstTime ? 'Create password & sign in' : 'Sign in';
    } else {
      els.authGateSub.textContent = "Enter your @plumcore.com email. We'll email you a one-time link to sign in — no password needed.";
      els.authModeToggle.textContent = 'Admin? Sign in with a password instead';
      els.authSendBtn.textContent = 'Send sign-in link';
    }
    setGateMessage('', false);
  }

  function onAuthModeToggle() {
    authGateMode = authGateMode === 'admin' ? 'employee' : 'admin';
    authAdminFirstTime = false;
    els.authPasswordInput.value = '';
    renderGateMode();
  }

  function onAuthFirstTimeToggle() {
    authAdminFirstTime = !authAdminFirstTime;
    renderGateMode();
  }

  function submitAdminSignIn(email, password) {
    setGateBusy(true);
    setGateMessage(authAdminFirstTime ? 'Creating your password…' : 'Signing you in…', false);
    var authCall = authAdminFirstTime
      ? createUserWithEmailAndPassword(firebaseAuth, email, password)
      : signInWithEmailAndPassword(firebaseAuth, email, password);
    authCall.catch(function (err) {
      setGateBusy(false);
      var code = err && err.code;
      if (code === 'auth/email-already-in-use') {
        setGateMessage('That email already has a password set. Switch to "Sign in" and use it.', true);
      } else if (code === 'auth/weak-password') {
        setGateMessage('Choose a password with at least 6 characters.', true);
      } else if (code === 'auth/wrong-password' || code === 'auth/invalid-credential') {
        setGateMessage('Incorrect email or password.', true);
      } else if (code === 'auth/user-not-found') {
        setGateMessage('No admin account yet for that email. Use "First time? Create your password instead."', true);
      } else {
        setGateMessage("Couldn't sign you in. Try again in a moment.", true);
      }
    });
  }

  function requestSignInLink(email) {
    var actionCodeSettings = {
      url: window.location.origin + window.location.pathname,
      handleCodeInApp: true
    };
    setGateBusy(true);
    setGateMessage('Sending your sign-in link…', false);
    sendSignInLinkToEmail(firebaseAuth, email, actionCodeSettings).then(function () {
      try { window.localStorage.setItem(AUTH_EMAIL_STORAGE_KEY, email); } catch (e) {}
      setGateBusy(false);
      setGateMessage('Check your email (' + email + ') for a sign-in link, then open it on this device.', false);
    }).catch(function (err) {
      setGateBusy(false);
      setGateMessage("Couldn't send that link. Try again in a moment.", true);
    });
  }

  function completeSignInFromLink() {
    if (!isSignInWithEmailLink(firebaseAuth, window.location.href)) return false;
    var storedEmail = null;
    try { storedEmail = window.localStorage.getItem(AUTH_EMAIL_STORAGE_KEY); } catch (e) {}
    if (!storedEmail) {
      setGateMessage('Confirm your @plumcore.com email to finish signing in.', false);
      return true; // gate stays up; wireStaticControls' submit handler will complete the link
    }
    finishEmailLinkSignIn(storedEmail);
    return true;
  }

  function finishEmailLinkSignIn(email) {
    setGateBusy(true);
    setGateMessage('Signing you in…', false);
    signInWithEmailLink(firebaseAuth, email, window.location.href).then(function () {
      try { window.localStorage.removeItem(AUTH_EMAIL_STORAGE_KEY); } catch (e) {}
      window.history.replaceState(null, '', window.location.pathname);
    }).catch(function (err) {
      setGateBusy(false);
      setGateMessage("That sign-in link didn't work — it may have expired. Request a new one.", true);
      window.history.replaceState(null, '', window.location.pathname);
    });
  }

  function onAuthGateSubmit(e) {
    e.preventDefault();
    var email = (els.authEmailInput.value || '').trim();
    if (!PLUMCORE_EMAIL_RE.test(email)) {
      setGateMessage('Enter a valid @plumcore.com email address.', true);
      return;
    }
    if (authGateMode === 'admin') {
      var password = els.authPasswordInput.value || '';
      if (password.length < 6) {
        setGateMessage('Enter your password (at least 6 characters).', true);
        return;
      }
      submitAdminSignIn(email, password);
      return;
    }
    if (isSignInWithEmailLink(firebaseAuth, window.location.href)) {
      finishEmailLinkSignIn(email);
    } else {
      requestSignInLink(email);
    }
  }

  // ---------------- DB wiring ----------------
  function boot() {
    render();
    var pendingLinkCompletion = completeSignInFromLink();
    if (!pendingLinkCompletion) setGateMessage('', false);
    // Watchdog on whether the FIRST snapshot ever arrives (not just whether
    // auth succeeded) — a Firestore listen can open its channel and then
    // never deliver data, and nothing used to catch that case.
    var dataTimer = null;
    onAuthStateChanged(firebaseAuth, function (user) {
      if (user && user.isAnonymous) {
        // Leftover anonymous session from before sign-in was required.
        // Clear it so the real sign-in gate shows instead of a broken
        // "signed in as null" state that Firestore will reject anyway.
        signOut(firebaseAuth);
        return;
      }
      currentUser = user || null;
      if (!user) {
        els.authGateOverlay.hidden = false;
        els.authSignedInAs.hidden = true;
        setGateBusy(false);
        return;
      }
      els.authGateOverlay.hidden = true;
      els.authSignedInAs.hidden = false;
      renderSignedInAs(user.email);
      if (docRef) return; // already booted for this page load
      dataTimer = setTimeout(function () {
        if (loaded) return;
        dbUnavailable = true; render();
      }, 15000);
      dbUnavailable = false;
      dbHandle = firestoreDb;
      docRef = doc(firestoreDb, 'board/week1');
      getDoc(doc(firestoreDb, 'admins', 'config')).then(function (snap) {
        var emails = (snap.exists() && Array.isArray(snap.data().emails)) ? snap.data().emails : [];
        isAdminUser = emails.some(function (e) { return typeof e === 'string' && e.toLowerCase() === user.email.toLowerCase(); });
        canEdit = isAdminUser;
        render();
      }).catch(function () {
        isAdminUser = false;
        canEdit = false;
        render();
      });
      authReadyResolve();
      onSnapshot(docRef, function (snap) {
        clearTimeout(dataTimer);
        loaded = true;
        disconnected = false;
        if (snap.exists()) {
          var data = snap.data() || {};
          state.sup1Name = (typeof data.sup1Name === 'string' && data.sup1Name) ? data.sup1Name : SUP_FALLBACK.sup1Name;
          state.sup2Name = (typeof data.sup2Name === 'string' && data.sup2Name) ? data.sup2Name : SUP_FALLBACK.sup2Name;
          state.sup3Name = (typeof data.sup3Name === 'string' && data.sup3Name) ? data.sup3Name : SUP_FALLBACK.sup3Name;
          state.sup4Name = (typeof data.sup4Name === 'string' && data.sup4Name) ? data.sup4Name : SUP_FALLBACK.sup4Name;
          state.sup5Name = (typeof data.sup5Name === 'string' && data.sup5Name) ? data.sup5Name : SUP_FALLBACK.sup5Name;
          state.sup6Name = (typeof data.sup6Name === 'string' && data.sup6Name) ? data.sup6Name : SUP_FALLBACK.sup6Name;
          state.sup7Name = (typeof data.sup7Name === 'string' && data.sup7Name) ? data.sup7Name : 'Charlie Cheetum';
          var f = (data.foremen && typeof data.foremen === 'object') ? data.foremen : {};
          state.foremen = {
            sup2: Array.isArray(f.sup2) ? f.sup2.filter(function (t) { return typeof t === 'string' && t; }) : [],
            sup3: Array.isArray(f.sup3) ? f.sup3.filter(function (t) { return typeof t === 'string' && t; }) : []
          };
          confirmedNames.sup1Name = state.sup1Name;
          confirmedNames.sup2Name = state.sup2Name;
          confirmedNames.sup3Name = state.sup3Name;
          confirmedNames.sup4Name = state.sup4Name;
          confirmedNames.sup5Name = state.sup5Name;
          confirmedNames.sup6Name = state.sup6Name;
          confirmedNames.sup7Name = state.sup7Name;
        } else {
          // The shared board doc came back missing. This used to auto-recreate
          // it with blank default names/foremen — which is exactly how real
          // data got silently overwritten (a reconnect or a transient blip can
          // make Firestore report "not found" even when the doc is really
          // there). Never auto-write here. Just surface it loudly and stop;
          // an admin has to look at this on purpose before anything is
          // touched. See window.__fabForceInitBoard if a board genuinely
          // needs to be created for the first time.
          triedInit = true;
          boardMissing = true;
          dbUnavailable = true;
        }
        render();
      }, function (err) {
        clearTimeout(dataTimer);
        if (!loaded) { dbUnavailable = true; } else { disconnected = true; }
        render();
      });
    });
  }

  // ---------------- Write actions ----------------
  function saveSupName(which) {
    var raw = inputForName(which).value;
    var fallback = SUP_FALLBACK[which];
    var v = raw.trim().slice(0, 40) || fallback;
    state[which] = v;
    render();
    var patch = {}; patch[which] = v;
    lastWriteError = '';
    authReady.then(function () {
      enqueueWrite(function () {
        return updateDoc(docRef, patch).catch(function (err) { handleWriteError(err, { revertName: which }); });
      });
    });
  }

  function onSupInput(which, value) {
    state[which] = value;
    render();
    clearTimeout(nameDebounce[which]);
    nameDebounce[which] = setTimeout(function () { saveSupName(which); }, 500);
  }

  function addForeman(supKey, name, errorEl) {
    var v = name.trim().slice(0, 40);
    errorEl.hidden = true;
    if (!v) return false;
    var list = state.foremen[supKey] || [];
    if (list.indexOf(v) !== -1) {
      errorEl.textContent = v + ' is already listed under this supervisor.';
      errorEl.hidden = false;
      return false;
    }
    var merged = cloneForemen(state.foremen);
    merged[supKey] = list.concat([v]);
    lastWriteError = '';
    authReady.then(function () {
      enqueueWrite(function () {
        return updateDoc(docRef, { foremen: merged }).catch(function (err) { handleWriteError(err); });
      });
    });
    return true;
  }

  function removeForeman(supKey, name) {
    var merged = cloneForemen(state.foremen);
    merged[supKey] = (merged[supKey] || []).filter(function (n) { return n !== name; });
    lastWriteError = '';
    authReady.then(function () {
      enqueueWrite(function () {
        return updateDoc(docRef, { foremen: merged }).catch(function (err) { handleWriteError(err); });
      });
    });
  }

  function clearAllForemen() {
    if (!window.confirm('Remove all Job Foremen from every supervisor? This cannot be undone.')) return;
    lastWriteError = '';
    authReady.then(function () {
      enqueueWrite(function () {
        return updateDoc(docRef, { foremen: { sup2: [], sup3: [] } }).catch(function (err) { handleWriteError(err); });
      });
    });
  }

  function saveScheduleEntry(personKey, dk, fields) {
    var readyPromise = scheduleReadyPromises[personKey];
    if (!dbHandle || !readyPromise) return; // panel was never opened via ensureScheduleSub; shouldn't happen from the UI
    var jobName = (fields.jobName || '').trim().slice(0, 60);
    var po = (fields.po || '').trim().slice(0, 30);
    var address = (fields.address || '').trim().slice(0, 100);
    var stage = (fields.stage || '').trim().slice(0, 60);
    var pm = (fields.pm || '').trim().slice(0, 60);
    var contractor = (fields.contractor || '').trim().slice(0, 60);
    var superintendent = (fields.superintendent || '').trim().slice(0, 60);
    var superintendentPhone = (fields.superintendentPhone || '').trim().slice(0, 20);
    var color = DAY_COLOR_KEYS.indexOf(fields.color) !== -1 ? fields.color : '';
    var off = fields.off === true;
    var holiday = fields.holiday === true;
    var isEmpty = !jobName && !po && !address && !stage && !pm && !contractor && !superintendent && !superintendentPhone && !color && !off && !holiday;
    readyPromise.then(function () {
      var ref = doc(dbHandle, 'schedules', slugify(personKey));
      var localDayMap = cloneDayMap(scheduleDocsCache[personKey]);
      var patch = {};
      if (isEmpty) {
        delete localDayMap[dk];
        patch[dk] = deleteField();
      } else {
        localDayMap[dk] = { jobName: jobName, po: po, address: address, stage: stage, pm: pm, contractor: contractor, superintendent: superintendent, superintendentPhone: superintendentPhone, color: color, off: off, holiday: holiday };
        patch[dk] = localDayMap[dk];
      }
      scheduleDocsCache[personKey] = localDayMap;
      lastWriteError = '';
      enqueueWrite(function () {
        return setDoc(ref, patch, { merge: true }).catch(function (err) { handleScheduleWriteError(err); });
      });
    });
  }

  // Schedule writes use their own (looser) rule, so a rejection here
  // means connectivity/lifecycle trouble, not an admin-only board edit —
  // never flips the board's canEdit flag.
  function handleScheduleWriteError(err) {
    if (err && err.code === 'unauthenticated') {
      disconnected = true;
    } else if (err && err.code === 'permission-denied') {
      lastWriteError = "Couldn't save this schedule entry — you may not have edit access.";
    } else if (err) {
      lastWriteError = "Couldn't save this schedule entry. Try again.";
    }
    render();
  }

  function displayNameForPersonKey(personKey) {
    if (personKey.indexOf('foreman:') === 0) {
      var parts = personKey.split(':');
      return parts[2] || personKey;
    }
    return state[personKey + 'Name'] || personKey;
  }

    renderCalendarOverlay();

  function closeCalendarView() {

    calendarSelectedDk = null;

    calendarViewDate = new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth() + delta, 1);

    calendarRepeatNote = '';
    renderCalendarOverlay();

  // ---------------- Rendering ----------------
  function renderStatusBanner() {
    var banner = els.statusBanner;
    if (lastWriteError) {
      banner.hidden = false;
      banner.className = 'status-banner status-error';
      banner.textContent = lastWriteError;
      return;
    }
    if (boardMissing) {
      banner.hidden = false;
      banner.className = 'status-banner status-error';
      banner.textContent = "The shared board data couldn't be found. Nothing has been changed — contact your admin before doing anything else here.";
      return;
    }
    if (dbUnavailable) {
      banner.hidden = false;
      banner.className = 'status-banner status-error';
      banner.textContent = "Can't connect to the shared board right now. Check your connection and reopen this page.";
      return;
    }
    if (disconnected) {
      banner.hidden = false;
      banner.className = 'status-banner status-warning';
      banner.textContent = 'Connection lost — showing the last saved version. Reopen the page to reconnect.';
      return;
    }
    if (!loaded) {
      banner.hidden = false;
      banner.className = 'status-banner status-info';
      banner.textContent = 'Connecting to the shared board…';
      return;
    }
    if (!canEdit) {
      banner.hidden = false;
      banner.className = 'status-banner status-info';
      banner.textContent = 'View only — ask your project manager for edit access to make changes here.';
      return;
    }
    banner.hidden = true;
  }

  function syncCrewInputs() {
    if (document.activeElement !== els.sup1Input) els.sup1Input.value = state.sup1Name;
    if (document.activeElement !== els.sup2Input) els.sup2Input.value = state.sup2Name;
    if (document.activeElement !== els.sup3Input) els.sup3Input.value = state.sup3Name;
    if (document.activeElement !== els.sup4Input) els.sup4Input.value = state.sup4Name;
    if (document.activeElement !== els.sup5Input) els.sup5Input.value = state.sup5Name;
    if (document.activeElement !== els.sup6Input) els.sup6Input.value = state.sup6Name;
    if (document.activeElement !== els.sup7Input) els.sup7Input.value = state.sup7Name;
    // Leadership names are locked for everyone, admins included — changes
    // are made only when Jonathan asks Claude to update them (see
    // window.__fabSetLeadershipName below), never by typing into these boxes.
    var disable = true;
    els.sup1Input.disabled = disable;
    els.sup2Input.disabled = disable;
    els.sup3Input.disabled = disable;
    els.sup4Input.disabled = disable;
    els.sup5Input.disabled = disable;
    els.sup6Input.disabled = disable;
    els.sup7Input.disabled = disable;

  // ---------------- Full-page schedule calendar ----------------
  var WEEKDAY_HEADERS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  function buildWeekdayRow() {
    if (els.calendarWeekdayRow.childNodes.length) return;
    WEEKDAY_HEADERS.forEach(function (label) {
      var el = document.createElement('span');
      el.className = 'calendar-weekday-label';
      el.textContent = label;
      els.calendarWeekdayRow.appendChild(el);
    });
  }

  function renderCalendarGrid(personKey, disableControls) {
    var grid = els.calendarGrid;
    grid.innerHTML = '';
    var entries = scheduleDocsCache[personKey] || {};
    var year = calendarViewDate.getFullYear();
    var month = calendarViewDate.getMonth();
    var firstDay = new Date(year, month, 1);
    var gridStart = addDays(firstDay, -firstDay.getDay());
    var todayKey = dateKey(new Date());

    for (var i = 0; i < 42; i++) {
      (function () {
        var date = addDays(gridStart, i);
        var dk = dateKey(date);
        var entry = entries[dk];

        var cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'calendar-day-cell';
        if (date.getMonth() !== month) cell.classList.add('is-other-month');
        if (dk === todayKey) cell.classList.add('is-today');
        if (dk === calendarSelectedDk) cell.classList.add('is-selected');
        if (entry && entry.off) cell.classList.add('is-off');
        if (entry && entry.holiday) cell.classList.add('is-holiday');

        var num = document.createElement('span');
        num.className = 'calendar-day-number';
        num.textContent = String(date.getDate());
        cell.appendChild(num);

        // US holiday label — computed from the date itself, shown on every
        // calendar automatically, never stored. Four holidays also get a
        // small animated icon (see the calendar-holiday-* CSS).
        var hol = holidayForDate(date);
        if (hol) {
          var holWrap = document.createElement('span');
          holWrap.className = 'calendar-day-holiday' + (hol.kind ? ' calendar-holiday-' + hol.kind : '');
          if (hol.kind) {
            var holIcon = document.createElement('span');
            holIcon.className = 'calendar-holiday-icon';
            holIcon.textContent = HOLIDAY_ICONS[hol.kind];
            holIcon.setAttribute('aria-hidden', 'true');
            holWrap.appendChild(holIcon);
          }
          var holText = document.createElement('span');
          holText.className = 'calendar-holiday-text';
          holText.textContent = hol.name;
          holWrap.appendChild(holText);
          cell.appendChild(holWrap);
        }

        if (entry && entry.jobName) {
          var chip = document.createElement('span');
          chip.className = 'calendar-day-job';
          chip.textContent = entry.jobName;
          var c = colorForKey(entry.color);
          if (c) {
            chip.style.background = c.bg;
            chip.style.color = 'var(--color-ink)';
            chip.style.borderLeft = '3px solid ' + c.border;
          }
          cell.appendChild(chip);
        }

        cell.addEventListener('click', function () { selectCalendarDay(dk); });
        grid.appendChild(cell);
      })();
    }
  }

  function renderDayEditor(personKey, disableControls) {
    var editor = els.calendarDayEditor;
    editor.innerHTML = '';
    if (!calendarSelectedDk) { editor.hidden = true; return; }
    editor.hidden = false;

    var dk = calendarSelectedDk;
    var dp = dk.split('-');
    var date = new Date(parseInt(dp[0], 10), parseInt(dp[1], 10) - 1, parseInt(dp[2], 10));
    var entries = scheduleDocsCache[personKey] || {};
    var entry = entries[dk] || { jobName: '', po: '', address: '', stage: '', pm: '', contractor: '', superintendent: '', superintendentPhone: '', color: '', off: false, holiday: false };

    var head = document.createElement('div');
    head.className = 'calendar-day-editor-head';
    var title = document.createElement('span');
    title.className = 'calendar-day-editor-title';
    title.textContent = fmtDayLabel(date);
    head.appendChild(title);
    var closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'calendar-back-btn';
    closeBtn.textContent = 'Close';
    closeBtn.addEventListener('click', function () { calendarSelectedDk = null; renderCalendarOverlay(); });
    head.appendChild(closeBtn);
    editor.appendChild(head);

    var fieldGrid = document.createElement('div');
    fieldGrid.className = 'calendar-field-grid';
    editor.appendChild(fieldGrid);

    function makeField(labelText, value, maxLen, spanFull) {
      var wrap = document.createElement('div');
      wrap.className = 'calendar-field' + (spanFull ? ' span-2' : '');
      var lbl = document.createElement('span');
      lbl.className = 'calendar-field-label';
      lbl.textContent = labelText;
      wrap.appendChild(lbl);
      var input = document.createElement('input');
      input.type = 'text';
      input.maxLength = maxLen;
      input.value = value;
      input.disabled = disableControls;
      wrap.appendChild(input);
      fieldGrid.appendChild(wrap);
      return input;
    }

    var jobNameInput = makeField('Job Name', entry.jobName, 60, false);
    var poInput = makeField('PO #', entry.po, 30, false);
    var addressInput = makeField('Address', entry.address, 100, true);
    var stageInput = makeField('Stage of Work', entry.stage, 60, true);
    var pmInput = makeField('PM', entry.pm, 60, false);
    var contractorInput = makeField('Contractor', entry.contractor, 60, false);
    var superintendentInput = makeField('Superintendent', entry.superintendent, 60, false);
    var superintendentPhoneInput = makeField('Superintendent Phone', entry.superintendentPhone, 20, false);

    var currentColor = entry.color || '';
    var currentOff = entry.off === true;
    var currentHoliday = entry.holiday === true;

    var save = function () {
      saveScheduleEntry(personKey, dk, {
        jobName: jobNameInput.value,
        po: poInput.value,
        address: addressInput.value,
        stage: stageInput.value,
        pm: pmInput.value,
        contractor: contractorInput.value,
        superintendent: superintendentInput.value,
        superintendentPhone: superintendentPhoneInput.value,
        color: currentColor,
        off: currentOff,
        holiday: currentHoliday
      });
      renderCalendarGrid(personKey, disableControls);
    };
    jobNameInput.addEventListener('blur', save);
    poInput.addEventListener('blur', save);
    addressInput.addEventListener('blur', save);
    stageInput.addEventListener('blur', save);
    pmInput.addEventListener('blur', save);
    contractorInput.addEventListener('blur', save);
    superintendentInput.addEventListener('blur', save);
    superintendentPhoneInput.addEventListener('blur', save);

    // Color is admin-only — anyone signed in can fill out the rest of a
    // day's schedule entry, but only an admin can pick/change its color.
    var colorDisabled = disableControls || !canEdit;
    var colorRow = document.createElement('div');
    colorRow.className = 'calendar-color-row';
    var colorLabel = document.createElement('span');
    colorLabel.className = 'calendar-color-row-label';
    colorLabel.textContent = 'Color';
    colorRow.appendChild(colorLabel);
    var colorDots = {};
    DAY_COLOR_KEYS.forEach(function (key) {
      var dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'calendar-color-dot';
      dot.title = key.charAt(0).toUpperCase() + key.slice(1);
      dot.style.background = colorForKey(key).border;
      dot.disabled = colorDisabled;
      dot.addEventListener('click', function () {
        currentColor = (currentColor === key) ? '' : key;
        DAY_COLOR_KEYS.forEach(function (k) { colorDots[k].classList.toggle('is-selected', currentColor === k); });
        save();
      });
      colorDots[key] = dot;
      colorRow.appendChild(dot);
    });
    DAY_COLOR_KEYS.forEach(function (k) { colorDots[k].classList.toggle('is-selected', currentColor === k); });

    // "Off" (job foreman not at work that day) is admin-only, same as
    // color - sits at the end of the color chart, small like the dots.
    // Toggling it saves immediately (shows the black X on the calendar
    // grid right away) and is also carried along by the repeat "Apply"
    // below so an admin can mark a whole date range off at once.
    var offBtn = document.createElement('button');
    offBtn.type = 'button';
    offBtn.className = 'calendar-off-btn';
    offBtn.textContent = 'Off';
    offBtn.title = 'Mark this day off (job foreman not at work)';
    offBtn.disabled = colorDisabled;
    if (currentOff) offBtn.classList.add('is-marked-off');
    offBtn.addEventListener('click', function () {
      currentOff = !currentOff;
      offBtn.classList.toggle('is-marked-off', currentOff);
      save();
    });
    colorRow.appendChild(offBtn);

    // "Holiday" is a separate, admin-only manual mark (green X) — it does
    // NOT auto-set itself from the US holiday list above; an admin picks
    // which days actually get treated as a company holiday. Same toggle
    // pattern as Off: saves immediately, carried along by "Apply".
    var holidayBtn = document.createElement('button');
    holidayBtn.type = 'button';
    holidayBtn.className = 'calendar-holiday-btn';
    holidayBtn.textContent = 'Holiday';
    holidayBtn.title = 'Mark this day as a company holiday';
    holidayBtn.disabled = colorDisabled;
    if (currentHoliday) holidayBtn.classList.add('is-marked-holiday');
    holidayBtn.addEventListener('click', function () {
      currentHoliday = !currentHoliday;
      holidayBtn.classList.toggle('is-marked-holiday', currentHoliday);
      save();
    });
    colorRow.appendChild(holidayBtn);
    editor.appendChild(colorRow);

    var clearBtn = document.createElement('button');
    clearBtn.type = 'button';
    clearBtn.className = 'calendar-back-btn';
    clearBtn.textContent = 'Clear this day';
    clearBtn.disabled = disableControls;
    clearBtn.addEventListener('click', function () {
      jobNameInput.value = ''; poInput.value = ''; addressInput.value = ''; stageInput.value = '';
      pmInput.value = ''; contractorInput.value = ''; superintendentInput.value = ''; superintendentPhoneInput.value = '';
      currentColor = '';
      currentOff = false;
      currentHoliday = false;
      DAY_COLOR_KEYS.forEach(function (k) { colorDots[k].classList.remove('is-selected'); });
      offBtn.classList.remove('is-marked-off');
      holidayBtn.classList.remove('is-marked-holiday');
      save();
    });
    editor.appendChild(clearBtn);

    var repeatRow = document.createElement('div');
    repeatRow.className = 'calendar-repeat-row';
    var repeatLabel = document.createElement('span');
    repeatLabel.textContent = 'Copy this entry through:';
    repeatRow.appendChild(repeatLabel);
    var repeatInput = document.createElement('input');
    repeatInput.type = 'date';
    repeatInput.min = dk;
    repeatInput.disabled = disableControls;
    repeatRow.appendChild(repeatInput);
    var applyBtn = document.createElement('button');
    applyBtn.type = 'button';
    applyBtn.className = 'calendar-back-btn';
    applyBtn.textContent = 'Apply';
    applyBtn.disabled = disableControls;
    editor.appendChild(repeatRow);

    var note = document.createElement('div');
    note.className = 'calendar-repeat-note';
    note.textContent = calendarRepeatNote;

    applyBtn.addEventListener('click', function () {
      if (!repeatInput.value) return;
      var ep = repeatInput.value.split('-');
      var endDate = new Date(parseInt(ep[0], 10), parseInt(ep[1], 10) - 1, parseInt(ep[2], 10));
      if (endDate < date) return;
      var values = { jobName: jobNameInput.value, po: poInput.value, address: addressInput.value, stage: stageInput.value, pm: pmInput.value, contractor: contractorInput.value, superintendent: superintendentInput.value, superintendentPhone: superintendentPhoneInput.value, off: currentOff, holiday: currentHoliday };
      var count = 0;
      var cur = date;
      while (cur <= endDate) {
        saveScheduleEntry(personKey, dateKey(cur), values);
        count++;
        cur = addDays(cur, 1);
      }
      calendarRepeatNote = 'Applied to ' + count + ' day' + (count === 1 ? '' : 's') + '.';
      note.textContent = calendarRepeatNote;
      renderCalendarGrid(personKey, disableControls);
    });
    repeatRow.appendChild(applyBtn);
    editor.appendChild(note);
  }

  function renderCalendarOverlay() {
    if (!calendarOpenPerson) return;
    var personKey = calendarOpenPerson;
    var disableControls = dbUnavailable;
    els.calendarPersonName.textContent = displayNameForPersonKey(personKey);
    els.calendarMonthLabel.textContent = MONTH_NAMES_FULL[calendarViewDate.getMonth()] + ' ' + calendarViewDate.getFullYear();
    buildWeekdayRow();
    renderCalendarGrid(personKey, disableControls);
    renderDayEditor(personKey, disableControls);

  function renderProjectsOverlay() {
    if (!projectsOpenSup) return;
    var supKey = projectsOpenSup;
    var disableControls = dbUnavailable;
    els.projectsPersonName.textContent = displayNameForPersonKey(supKey) + ' — Projects';
    els.projectsAddBtn.disabled = disableControls;

    var list = els.projectsList;
    list.innerHTML = '';
    var items = projectsDocsCache[supKey] || [];

    if (!items.length) {
      var empty = document.createElement('div');
      empty.className = 'projects-empty';
      empty.textContent = 'No projects yet.';
      list.appendChild(empty);
    }

    items.forEach(function (item, idx) {
      var row = document.createElement('div');
      row.className = 'project-row';

      function makeProjectField(labelText, key, type) {
        var wrap = document.createElement('div');
        wrap.className = 'project-field';
        var lbl = document.createElement('span');
        lbl.className = 'project-field-label';
        lbl.textContent = labelText;
        wrap.appendChild(lbl);
        var input = document.createElement('input');
        input.type = type || 'text';
        if (type !== 'date') input.maxLength = 80;
        input.value = item[key];
        input.disabled = disableControls;
        input.addEventListener('blur', function () {
          var current = (projectsDocsCache[supKey] || []).slice();
          if (!current[idx]) return;
          var updated = {
            id: current[idx].id,
            job: current[idx].job,
            startDate: current[idx].startDate,
            contractor: current[idx].contractor,
            contact: current[idx].contact,
            pm: current[idx].pm
          };
          updated[key] = input.value;
          current[idx] = updated;
          saveProjectsList(supKey, current);
        });
        wrap.appendChild(input);
        return wrap;
      }

      row.appendChild(makeProjectField('Job', 'job', 'text'));
      row.appendChild(makeProjectField('Start Date', 'startDate', 'date'));
      row.appendChild(makeProjectField('Contractor', 'contractor', 'text'));
      row.appendChild(makeProjectField('Contact', 'contact', 'text'));
      row.appendChild(makeProjectField('PM', 'pm', 'text'));

      var removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'project-remove-btn';
      removeBtn.textContent = 'Remove';
      removeBtn.disabled = disableControls;
      removeBtn.addEventListener('click', function () {
        var current = (projectsDocsCache[supKey] || []).slice();
        current.splice(idx, 1);
        saveProjectsList(supKey, current);
      });
      row.appendChild(removeBtn);

      list.appendChild(row);
    });
  }

  function renderForemen() {
    // Job Foremen names are locked too — same rule as the leadership
    // names above: nobody edits names by clicking into a box. Admins keep
    // editing only the individual Schedule (see the Schedule buttons
    // below, still gated on dbUnavailable only, not on this).
    var disableControls = true;

      var names = state.foremen[supKey] || [];

      if (!names.length) {
        var empty = document.createElement('p');

        empty.textContent = loaded ? 'No Job Foremen yet.' : 'Loading…';
        listEl.appendChild(empty);
      } else {
        names.forEach(function (name) {
          var personKey = 'foreman:' + supKey + ':' + name;

          var entryWrap = document.createElement('div');
