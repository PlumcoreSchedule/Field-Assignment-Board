          var scheduleBtn = document.createElement('button');
          scheduleBtn.type = 'button';
          scheduleBtn.className = 'schedule-toggle-btn';
          scheduleBtn.textContent = 'Schedule';
          scheduleBtn.disabled = dbUnavailable;
          scheduleBtn.addEventListener('click', function () { openCalendarView(personKey); });
          box.appendChild(scheduleBtn);

          entryWrap.appendChild(box);
          listEl.appendChild(entryWrap);
        });
      }
    });
  }

  var DATETIME_DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

  function renderDateTimeBar() {
    var now = new Date();
    els.datetimeDate.textContent = (now.getMonth() + 1) + '/' + now.getDate() + '/' + now.getFullYear();
    var h = now.getHours();
    var ampm = h >= 12 ? 'PM' : 'AM';
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    els.datetimeClock.textContent = h12 + ':' + pad2(now.getMinutes()) + ':' + pad2(now.getSeconds()) + ' ' + ampm;
  }

  function render() {
    renderStatusBanner();
    syncCrewInputs();
    renderForemen();
    ['sup4', 'sup5', 'sup6', 'sup7'].forEach(function (supKey) {
      els.scheduleToggle[supKey].disabled = dbUnavailable;
    });
    ['sup2', 'sup3', 'sup7'].forEach(function (supKey) {
      els.projectsToggle[supKey].disabled = dbUnavailable;
    });
    if (calendarOpenPerson) renderCalendarOverlay();
    if (projectsOpenSup) renderProjectsOverlay();
  }

  function wireStaticControls() {
    els.sup1Input.addEventListener('input', function (e) { onSupInput('sup1Name', e.target.value); });
    els.sup2Input.addEventListener('input', function (e) { onSupInput('sup2Name', e.target.value); });
    els.sup3Input.addEventListener('input', function (e) { onSupInput('sup3Name', e.target.value); });
    els.sup4Input.addEventListener('input', function (e) { onSupInput('sup4Name', e.target.value); });
    els.sup5Input.addEventListener('input', function (e) { onSupInput('sup5Name', e.target.value); });
    els.sup6Input.addEventListener('input', function (e) { onSupInput('sup6Name', e.target.value); });
    els.sup7Input.addEventListener('input', function (e) { onSupInput('sup7Name', e.target.value); });
    els.sup1Input.addEventListener('blur', function () { clearTimeout(nameDebounce.sup1Name); saveSupName('sup1Name'); });
    els.sup2Input.addEventListener('blur', function () { clearTimeout(nameDebounce.sup2Name); saveSupName('sup2Name'); });
    els.sup3Input.addEventListener('blur', function () { clearTimeout(nameDebounce.sup3Name); saveSupName('sup3Name'); });
    els.sup4Input.addEventListener('blur', function () { clearTimeout(nameDebounce.sup4Name); saveSupName('sup4Name'); });
    els.sup5Input.addEventListener('blur', function () { clearTimeout(nameDebounce.sup5Name); saveSupName('sup5Name'); });
    els.sup6Input.addEventListener('blur', function () { clearTimeout(nameDebounce.sup6Name); saveSupName('sup6Name'); });
    els.sup7Input.addEventListener('blur', function () { clearTimeout(nameDebounce.sup7Name); saveSupName('sup7Name'); });

    ['sup4', 'sup5', 'sup6', 'sup7'].forEach(function (supKey) {
      els.scheduleToggle[supKey].addEventListener('click', function () { openCalendarView(supKey); });
    });

    els.calendarBackBtn.addEventListener('click', closeCalendarView);
    els.calendarPrevBtn.addEventListener('click', function () { shiftCalendarMonth(-1); });
    els.calendarNextBtn.addEventListener('click', function () { shiftCalendarMonth(1); });
    els.calendarTodayBtn.addEventListener('click', resetCalendarToToday);

    ['sup2', 'sup3'].forEach(function (supKey) {
      var submitForeman = function (e) {
        if (e) e.preventDefault();
        var input = els.foremanInput[supKey];
        var ok = addForeman(supKey, input.value, els.foremanError[supKey]);
        if (ok) input.value = '';
      };
      els.addForemanForm[supKey].addEventListener('submit', submitForeman);
      els.addForemanBtn[supKey].addEventListener('click', submitForeman);
    });

    ['sup2', 'sup3', 'sup7'].forEach(function (supKey) {
      els.projectsToggle[supKey].addEventListener('click', function () { openProjectsView(supKey); });
    });
    els.projectsBackBtn.addEventListener('click', closeProjectsView);
    els.projectsAddBtn.addEventListener('click', function () {
      if (!projectsOpenSup) return;
      var current = (projectsDocsCache[projectsOpenSup] || []).slice();
      current.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
        job: '', startDate: '', contractor: '', contact: '', pm: ''
      });
      saveProjectsList(projectsOpenSup, current);
    });
  }

  function start() {
    els.authGateOverlay = q('authGateOverlay');
    els.authGateForm = q('authGateForm');
    els.authGateSub = q('authGateSub');
    els.authEmailInput = q('authEmailInput');
    els.authPasswordInput = q('authPasswordInput');
    els.authSendBtn = q('authSendBtn');
    els.authGateMsg = q('authGateMsg');
    els.authModeToggle = q('authModeToggle');
    els.authFirstTimeToggle = q('authFirstTimeToggle');
    els.authSignedInAs = q('authSignedInAs');
    els.authGateForm.addEventListener('submit', onAuthGateSubmit);
    els.authModeToggle.addEventListener('click', onAuthModeToggle);
    els.authFirstTimeToggle.addEventListener('click', onAuthFirstTimeToggle);
    els.authSignedInAs.addEventListener('click', function () {
      signOut(firebaseAuth);
    });
    renderGateMode();

    els.statusBanner = q('statusBanner');
    els.sup1Input = q('sup1Input');
    els.sup2Input = q('sup2Input');
    els.sup3Input = q('sup3Input');
    els.sup4Input = q('sup4Input');
    els.sup5Input = q('sup5Input');
    els.sup6Input = q('sup6Input');
    els.sup7Input = q('sup7Input');
    els.foremanList = { sup2: q('foremanList-sup2'), sup3: q('foremanList-sup3') };
    els.foremanInput = { sup2: q('foremanInput-sup2'), sup3: q('foremanInput-sup3') };
    els.foremanError = { sup2: q('foremanError-sup2'), sup3: q('foremanError-sup3') };
    els.addForemanForm = { sup2: q('addForemanForm-sup2'), sup3: q('addForemanForm-sup3') };
    els.addForemanBtn = { sup2: q('addForemanBtn-sup2'), sup3: q('addForemanBtn-sup3') };

    els.datetimeDate = q('datetimeDate');
    els.datetimeClock = q('datetimeClock');
    els.scheduleToggle = { sup4: q('scheduleToggle-sup4'), sup5: q('scheduleToggle-sup5'), sup6: q('scheduleToggle-sup6'), sup7: q('scheduleToggle-sup7') };
    els.calendarOverlay = q('calendarOverlay');
    els.calendarBackBtn = q('calendarBackBtn');
    els.calendarPersonName = q('calendarPersonName');
    els.calendarPrevBtn = q('calendarPrevBtn');
    els.calendarNextBtn = q('calendarNextBtn');
    els.calendarTodayBtn = q('calendarTodayBtn');
    els.calendarMonthLabel = q('calendarMonthLabel');
    els.calendarWeekdayRow = q('calendarWeekdayRow');
    els.calendarGrid = q('calendarGrid');
    els.calendarDayEditor = q('calendarDayEditor');

    els.projectsToggle = { sup2: q('projectsToggle-sup2'), sup3: q('projectsToggle-sup3'), sup7: q('projectsToggle-sup7') };
    els.projectsOverlay = q('projectsOverlay');
    els.projectsBackBtn = q('projectsBackBtn');
    els.projectsPersonName = q('projectsPersonName');
    els.projectsList = q('projectsList');
    els.projectsAddBtn = q('projectsAddBtn');

    // ---------------- Admin-only name updates (console-only, no UI control) ----------------
    // The leadership name fields above are permanently disabled (see
    // syncCrewInputs) so nobody can edit them by clicking in — on purpose.
    // Jonathan asks Claude to change a name, and Claude runs this from the
    // browser console while signed in as an admin. Not linked from any
    // button or menu.
    var LEADERSHIP_NAME_KEYS = ['sup1Name', 'sup2Name', 'sup3Name', 'sup4Name', 'sup5Name', 'sup6Name', 'sup7Name'];
    window.__fabSetLeadershipName = function (which, value) {
      if (LEADERSHIP_NAME_KEYS.indexOf(which) === -1) {
        return Promise.reject(new Error('Unknown field "' + which + '". Valid: ' + LEADERSHIP_NAME_KEYS.join(', ')));
      }
      if (!docRef) {
        return Promise.reject(new Error('Board not loaded yet — try again in a moment.'));
      }
      var fallback = SUP_FALLBACK[which];
      var v = String(value || '').trim().slice(0, 40) || fallback;
      state[which] = v;
      render();
      var patch = {}; patch[which] = v;
      lastWriteError = '';
      return authReady.then(function () {
        return enqueueWrite(function () {
          return updateDoc(docRef, patch).catch(function (err) {
            handleWriteError(err, { revertName: which });
            throw err;
          });
        });
      });
    };
    window.__fabGetLeadershipNames = function () {
      var out = {};
      LEADERSHIP_NAME_KEYS.forEach(function (k) { out[k] = state[k]; });
      return out;
    };

    // Job Foremen add/remove is locked in the UI the same way (see
    // renderForemen) — these are the console-only equivalents.
    window.__fabAddForeman = function (supKey, name) {
      if (SUP_KEYS.indexOf(supKey) === -1) {
        return Promise.reject(new Error('Unknown supervisor key "' + supKey + '". Valid: ' + SUP_KEYS.join(', ')));
      }
      if (!docRef) {
        return Promise.reject(new Error('Board not loaded yet — try again in a moment.'));
      }
      var v = String(name || '').trim().slice(0, 40);
      if (!v) {
        return Promise.reject(new Error('Name cannot be empty.'));
      }
      var list = state.foremen[supKey] || [];
      if (list.indexOf(v) !== -1) {
        return Promise.reject(new Error(v + ' is already listed under this supervisor.'));
      }
      var merged = cloneForemen(state.foremen);
      merged[supKey] = list.concat([v]);
      lastWriteError = '';
      return authReady.then(function () {
        return enqueueWrite(function () {
          return updateDoc(docRef, { foremen: merged }).catch(function (err) {
            handleWriteError(err);
            throw err;
          });
        });
      });
    };
    window.__fabRemoveForeman = function (supKey, name) {
      if (SUP_KEYS.indexOf(supKey) === -1) {
        return Promise.reject(new Error('Unknown supervisor key "' + supKey + '". Valid: ' + SUP_KEYS.join(', ')));
      }
      if (!docRef) {
        return Promise.reject(new Error('Board not loaded yet — try again in a moment.'));
      }
      var merged = cloneForemen(state.foremen);
      merged[supKey] = (merged[supKey] || []).filter(function (n) { return n !== name; });
      lastWriteError = '';
      return authReady.then(function () {
        return enqueueWrite(function () {
          return updateDoc(docRef, { foremen: merged }).catch(function (err) {
            handleWriteError(err);
            throw err;
          });
        });
      });
    };
    window.__fabGetForemen = function () {
      return cloneForemen(state.foremen);
    };

    // Deliberate, explicit escape hatch for the one legitimate case where
    // board/week1 really doesn't exist yet (a brand-new deployment). Unlike
    // the old auto-recreate behavior this replaced, it does nothing on its
    // own — it only runs when Claude calls it by hand with real values, and
    // it refuses outright if the doc turns out to already exist, so it can
    // never be the thing that silently overwrites real data again.
    window.__fabForceInitBoard = function (values) {
      if (!docRef) {
        return Promise.reject(new Error('Board not loaded yet — try again in a moment.'));
      }
      values = values || {};
      return getDoc(docRef).then(function (snap) {
        if (snap.exists()) {
          throw new Error('Refusing: board/week1 already exists. Use __fabSetLeadershipName / __fabAddForeman to edit it instead.');
        }
        var payload = {
          sup1Name: typeof values.sup1Name === 'string' && values.sup1Name ? values.sup1Name : SUP_FALLBACK.sup1Name,
          sup2Name: typeof values.sup2Name === 'string' && values.sup2Name ? values.sup2Name : SUP_FALLBACK.sup2Name,
          sup3Name: typeof values.sup3Name === 'string' && values.sup3Name ? values.sup3Name : SUP_FALLBACK.sup3Name,
          sup4Name: typeof values.sup4Name === 'string' && values.sup4Name ? values.sup4Name : SUP_FALLBACK.sup4Name,
          sup5Name: typeof values.sup5Name === 'string' && values.sup5Name ? values.sup5Name : SUP_FALLBACK.sup5Name,
          sup6Name: typeof values.sup6Name === 'string' && values.sup6Name ? values.sup6Name : SUP_FALLBACK.sup6Name,
          sup7Name: typeof values.sup7Name === 'string' && values.sup7Name ? values.sup7Name : SUP_FALLBACK.sup7Name,
          foremen: (values.foremen && typeof values.foremen === 'object') ? {
            sup2: Array.isArray(values.foremen.sup2) ? values.foremen.sup2.filter(function (t) { return typeof t === 'string' && t; }) : [],
            sup3: Array.isArray(values.foremen.sup3) ? values.foremen.sup3.filter(function (t) { return typeof t === 'string' && t; }) : []
          } : { sup2: [], sup3: [] }
        };
        return setDoc(docRef, payload);
      });
    };

    wireStaticControls();
    renderDateTimeBar();
    setInterval(renderDateTimeBar, 1000);
    boot();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>

</body>
</html>
