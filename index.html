<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Assignment Board</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192x192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
  :root {
    --color-canvas: #FAF5EC;
    --color-surface: #FFFFFF;
    --color-surface-alt: #F3ECDF;
    --color-border: #E1D6C2;
    --color-border-strong: #CBBB9C;
    --color-ink: #2B241C;
    --color-ink-muted: #6B5E4C;
    --color-accent: #B85C2E;
    --color-accent-ink: #FFFFFF;
    --color-accent-soft: #F0DCC9;
    --color-danger: #A8402A;
    --color-danger-soft: #F4DCD3;
    --color-sup1: #B33A2E;
    --color-sup1-ink: #FFFFFF;
    --color-sup2: #B8862B;
    --color-sup2-ink: #241C0E;
    --color-sup3: #3E7C4A;
    --color-sup3-ink: #FFFFFF;
    --color-sup4: #2F5FA8;
    --color-sup4-ink: #FFFFFF;
    --color-sup5: #1E5631;
    --color-sup5-ink: #FFFFFF;
    --color-sup6: #16324F;
    --color-sup6-ink: #FFFFFF;
    --color-sup7: #C1600A;
    --color-sup7-ink: #FFFFFF;
    --color-hvac1: #1F6F6F;
    --color-hvac1-ink: #FFFFFF;
    --color-hvac2: #5B4B8A;
    --color-hvac2-ink: #FFFFFF;
    --color-hvac3: #3E7C99;
    --color-hvac3-ink: #FFFFFF;
    --color-hvac4: #8C4B6B;
    --color-hvac4-ink: #FFFFFF;
    --color-empty-bg: #F3ECDF;
    --color-empty-border: #D8CBAF;
    --color-focus: #1F6F6F;
    --shadow-sm: 0 1px 2px rgba(43, 36, 28, 0.10);
    --shadow-md: 0 6px 18px rgba(43, 36, 28, 0.12);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 18px;

    --font-display: 'Fraunces', Georgia, 'Iowan Old Style', serif;
    --font-body: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;

    --text-xs: 0.72rem;
    --text-sm: 0.82rem;
    --text-base: 0.94rem;
    --text-md: 1.05rem;
    --text-lg: 1.3rem;
    --text-xl: 1.85rem;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --color-canvas: #1C1712;
      --color-surface: #241E17;
      --color-surface-alt: #2C251C;
      --color-border: #40372A;
      --color-border-strong: #574A37;
      --color-ink: #F1E8DA;
      --color-ink-muted: #B7A98F;
      --color-accent: #E2894F;
      --color-accent-ink: #241004;
      --color-accent-soft: #3E2E1E;
      --color-danger: #E2694A;
      --color-danger-soft: #3C241C;
      --color-sup1: #E2776B;
      --color-sup1-ink: #2A0D08;
      --color-sup2: #DDAA4C;
      --color-sup2-ink: #241A05;
      --color-sup3: #6FBF7B;
      --color-sup3-ink: #0C2210;
      --color-sup4: #7FB2E8;
      --color-sup4-ink: #0B2036;
      --color-sup5: #4FA868;
      --color-sup5-ink: #0F2A18;
      --color-sup6: #5B8FC7;
      --color-sup6-ink: #0A1B2E;
      --color-sup7: #E8985A;
      --color-sup7-ink: #241004;
      --color-hvac1: #5BAFAF;
      --color-hvac1-ink: #072323;
      --color-hvac2: #9C8AD1;
      --color-hvac2-ink: #1E1030;
      --color-hvac3: #7FB8D6;
      --color-hvac3-ink: #0B2430;
      --color-hvac4: #D090AC;
      --color-hvac4-ink: #2E0F1C;
      --color-empty-bg: #2C251C;
      --color-empty-border: #443A2B;
      --color-focus: #7ED0CA;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 8px 22px rgba(0, 0, 0, 0.45);
    }
  }

  :root[data-theme="dark"] {
    --color-canvas: #1C1712;
    --color-surface: #241E17;
    --color-surface-alt: #2C251C;
    --color-border: #40372A;
    --color-border-strong: #574A37;
    --color-ink: #F1E8DA;
    --color-ink-muted: #B7A98F;
    --color-accent: #E2894F;
    --color-accent-ink: #241004;
    --color-accent-soft: #3E2E1E;
    --color-danger: #E2694A;
    --color-danger-soft: #3C241C;
    --color-sup1: #E2776B;
    --color-sup1-ink: #2A0D08;
    --color-sup2: #DDAA4C;
    --color-sup2-ink: #241A05;
    --color-sup3: #6FBF7B;
    --color-sup3-ink: #0C2210;
    --color-sup4: #7FB2E8;
    --color-sup4-ink: #0B2036;
    --color-sup5: #4FA868;
    --color-sup5-ink: #0F2A18;
    --color-sup6: #5B8FC7;
    --color-sup6-ink: #0A1B2E;
    --color-sup7: #E8985A;
    --color-sup7-ink: #241004;
    --color-hvac1: #5BAFAF;
    --color-hvac1-ink: #072323;
    --color-hvac2: #9C8AD1;
    --color-hvac2-ink: #1E1030;
    --color-hvac3: #7FB8D6;
    --color-hvac3-ink: #0B2430;
    --color-hvac4: #D090AC;
    --color-hvac4-ink: #2E0F1C;
    --color-empty-bg: #2C251C;
    --color-empty-border: #443A2B;
    --color-focus: #7ED0CA;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 8px 22px rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--color-canvas);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: var(--text-base);
    line-height: 1.45;
    padding-inline: 16px;
    padding-block: 12px 28px;
  }

  h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }

  .page { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  /* ---------- header ---------- */
  .topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--color-canvas);
    padding-block: 10px;
    margin-inline: -16px;
    padding-inline: 16px;
    border-bottom: 1px solid var(--color-border);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
  }
  .topbar-center-logo {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
  }
  @media (max-width: 720px) {
    .topbar-center-logo { display: none; }
  }
  .topbar-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .brand-mark {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color-accent);
    font-weight: 600;
  }
  .page-title { font-size: var(--text-xl); font-weight: 600; color: var(--color-ink); }
  .title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .brand-logo { height: 60px; width: auto; display: block; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .brand-logo {
      background: #FFFFFF;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
    }
  }
  :root[data-theme="dark"] .brand-logo {
    background: #FFFFFF;
    padding: 4px 8px;
    border-radius: var(--radius-sm);
  }
  .topbar-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-wrap: wrap; }
  .topbar-right-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .combined-calendar-btn {
    font-family: var(--font-body);
    font-size: var(--text-sm);
    font-weight: 600;
    border-radius: var(--radius-sm);
    padding: 8px 14px;
    min-height: 38px;
    border: 1px solid var(--color-border-strong);
    background: var(--color-surface);
    color: var(--color-ink);
    cursor: pointer;
    white-space: nowrap;
  }
  .combined-calendar-btn:hover:not(:disabled) { background: var(--color-accent-soft); color: var(--color-accent); }
  .combined-calendar-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .combined-calendar-filter-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 12px 16px 0;
  }

  /* ---------- Gantt Chart (pulls from the same schedule data as the
     Combined Calendar - Plumbing section first, then HVAC, 3 months
     visible at once). One shared month-header row at the top, then each
     division's rows underneath - one row per person, with colored bars
     (colorForKey - the same palette used everywhere else) positioned by
     percentage across the row's timeline. ---------- */
  .gantt-body { padding: 8px 16px 24px; }
  .gantt-section { margin-top: 22px; }
  .gantt-section-title {
    font-family: var(--font-display);
    font-size: var(--text-lg);
    font-weight: 600;
    color: var(--color-ink);
    padding: 6px 0;
    border-bottom: 2px solid var(--color-border-strong);
    margin-bottom: 4px;
  }
  .gantt-empty { color: var(--color-ink-muted); font-size: var(--text-sm); padding: 10px 0 16px; }
  .gantt-row {
    display: flex;
    align-items: stretch;
    border-bottom: 1px solid var(--color-border);
    min-height: 36px;
  }
  .gantt-row-name {
    flex: 0 0 160px;
    width: 160px;
    font-size: var(--text-sm);
    font-weight: 600;
    color: var(--color-ink);
    padding: 6px 10px 6px 0;
    display: flex;
    align-items: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .gantt-timeline-header-row { border-bottom: 2px solid var(--color-border-strong); min-height: 30px; }
  .gantt-timeline {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
  }
  .gantt-month-header { position: relative; height: 30px; }
  .gantt-month-seg {
    position: absolute;
    top: 0;
    bottom: 0;
    border-left: 1px solid var(--color-border);
    font-size: var(--text-xs);
    font-weight: 700;
    color: var(--color-ink-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    overflow: hidden;
    white-space: nowrap;
  }
  .gantt-month-seg:first-child { border-left: none; }
  .gantt-row-timeline {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 36px;
  }
  .gantt-bar {
    position: absolute;
    top: 5px;
    bottom: 5px;
    min-width: 3px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--color-border-strong);
    background: var(--color-surface-alt);
    font-size: var(--text-xs);
    color: var(--color-ink);
    overflow: hidden;
    white-space: nowrap;
    display: flex;
    align-items: center;
    padding: 0 5px;
    box-sizing: border-box;
  }

  /* ---------- section divider (a second division's header further down the
     same home page, e.g. HVAC below Plumbing) - same brand-mark/title/logo
     look as the topbar above, but NOT sticky and with no signed-in-as /
     date-time (those already show once, in the real topbar). ---------- */
  .section-divider {
    position: relative;
    background: var(--color-canvas);
    margin-top: 8px;
    padding-block: 16px;
    border-top: 1px solid var(--color-border);
    border-bottom: 1px solid var(--color-border);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
  }
  .section-divider-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .hvac-placeholder {
    color: var(--color-ink-muted);
    font-size: var(--text-sm);
    padding: 20px 16px;
    border: 1px dashed var(--color-border);
    border-radius: var(--radius-md);
    text-align: center;
  }

  .btn {
    font-family: var(--font-body);
    font-size: var(--text-sm);
    font-weight: 600;
    border-radius: var(--radius-sm);
    padding: 9px 14px;
    border: 1px solid transparent;
    cursor: pointer;
    min-height: 40px;
    transition: filter 0.12s ease, transform 0.05s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
  .btn:disabled { cursor: not-allowed; opacity: 0.5; filter: none; }

  .btn-sm { min-height: 34px; padding: 6px 12px; font-size: var(--text-xs); }

  .btn-primary { background: var(--color-accent); color: var(--color-accent-ink); }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.06); }

  .btn-ghost-danger {
    background: transparent;
    color: var(--color-danger);
    border-color: var(--color-danger);
  }
  .btn-ghost-danger:hover:not(:disabled) { background: var(--color-danger-soft); }

  /* ---------- status banner ---------- */
  .status-banner {
    border-radius: var(--radius-md);
    padding: 10px 14px;
    font-size: var(--text-sm);
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--color-border);
  }
  .status-banner[hidden] {
    display: none;
  }
  .status-banner::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex: none;
    background: currentColor;
  }
  .status-info { background: var(--color-surface-alt); color: var(--color-ink-muted); border-color: var(--color-border); }
  .status-info::before { animation: pulse 1.6s ease-in-out infinite; }
  .status-warning { background: var(--color-accent-soft); color: var(--color-accent); border-color: var(--color-accent); }
  .status-error { background: var(--color-danger-soft); color: var(--color-danger); border-color: var(--color-danger); }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .status-info::before { animation: none; }
    * { transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
  }

  /* ---------- org chart: crew ---------- */
  .crew {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .crew-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .swatch {
    width: 22px;
    height: 22px;
    border-radius: 7px;
    flex: none;
    border: 1px solid rgba(0,0,0,0.15);
  }
  .swatch-sup1 { background: var(--color-sup1); }
  .swatch-sup2 { background: var(--color-sup2); }
  .swatch-sup3 { background: var(--color-sup3); }
  .swatch-sup4 { background: var(--color-sup4); }
  .swatch-sup5 { background: var(--color-sup5); }
  .swatch-sup6 { background: var(--color-sup6); }
  .swatch-sup7 { background: var(--color-sup7); }
  .swatch-hvac1 { background: var(--color-hvac1); }
  .swatch-hvac2 { background: var(--color-hvac2); }
  .swatch-hvac3 { background: var(--color-hvac3); }
  .swatch-hvac4 { background: var(--color-hvac4); }

  .crew-field { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
  .field-label {
    font-size: var(--text-xs);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--color-ink-muted);
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .crew-input {
    font-family: var(--font-body);
    font-size: var(--text-md);
    font-weight: 600;
    color: var(--color-ink);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 2px 0;
    min-width: 0;
    width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .crew-input:hover:not(:disabled) { border-bottom-color: var(--color-border-strong); }
  .crew-input:focus { outline: none; border-bottom-color: var(--color-focus); }
  .crew-input:disabled { color: var(--color-ink-muted); }

  .crew-lead-card {
    width: 100%;
    flex: 0 0 auto;
    padding: 9px 12px;
  }
  .crew-lead-card .swatch { width: 18px; height: 18px; }
  .crew-lead-card .crew-input { font-size: var(--text-sm); }

  .crew-sub-row {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-left: 14px;
    padding-left: 16px;
    border-left: 3px solid var(--color-border-strong);
  }
  .supervisor-branch {
    flex: 1 1 220px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  .branch-stack {
    flex: 1 1 220px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 0;
  }
  .branch-stack .supervisor-branch { flex: none; }
  .supervisor-branch .crew-card {
    padding: 9px 12px;
  }
  .supervisor-branch .swatch { width: 18px; height: 18px; }
  .supervisor-branch .crew-input { font-size: var(--text-sm); }

  /* ---------- lead row: supervisors + datetime, side by side ---------- */
  .lead-row {
    display: flex;
    flex-wrap: wrap;
    align-items: stretch;
    gap: 14px;
  }
  .lead-row .crew-lead-card { flex: 1 1 320px; width: auto; }
  .lead-row > .supervisor-branch { flex: 1 1 240px; }
  .lead-row .branch-stack { flex: 1 1 240px; }
  .lead-row .branch-stack .supervisor-branch { flex: none; }

  /* ---------- slab manager + plumbing foreman, left-aligned under supervisors ---------- */
  .crew-left-row {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-left: 14px;
    padding-left: 16px;
    border-left: 3px solid var(--color-border-strong);
  }
  .crew-left-row .supervisor-branch { flex: 0 1 300px; }

  /* ---------- installer: matches the width of the slab manager + plumbing foreman row above it ---------- */
  .installer-row { flex: 0 0 auto; width: 316px; max-width: 100%; margin-left: 14px; padding-left: 16px; }
  .installer-row .crew-card { width: 100%; }

  /* ---------- HVAC job foremen: two rows of two, centered under the board.
     Each column is sized to exactly 1/3 of the row's width (minus the two
     14px gaps a 3-column row would have) so a card matches the width of a
     Supervisor/Supervisor/Utilities column above (Jimmy's box) at any
     window width, even though only 2 of those 3 "slots" are used here. ---------- */
  .hvac-foreman-row {
    display: grid;
    grid-template-columns: repeat(2, calc((100% - 28px) / 3));
    justify-content: center;
    gap: 14px;
  }

  /* ---------- job foremen ---------- */
  .foreman-column {
    margin-left: 12px;
    padding-left: 14px;
    border-left: 2px solid var(--color-border);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .foreman-list { display: flex; flex-direction: column; gap: 6px; }
  .foreman-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-left: 4px solid var(--color-border-strong);
    border-radius: var(--radius-sm);
    padding: 7px 10px;
    box-shadow: var(--shadow-sm);
  }
  .foreman-box-sup2 { border-left-color: var(--color-sup2); }
  .foreman-box-sup3 { border-left-color: var(--color-sup3); }
  .foreman-box-sup4 { border-left-color: var(--color-sup4); }
  .foreman-box-sup7 { border-left-color: var(--color-sup7); }
  .foreman-name-text { font-weight: 600; font-size: var(--text-sm); overflow-wrap: anywhere; }
  .foreman-empty {
    font-size: var(--text-xs);
    color: var(--color-ink-muted);
    font-style: italic;
    padding: 4px 2px;
  }

  .add-foreman-form { display: none; }
  .add-foreman-form input[type="text"] {
    font-family: var(--font-body);
    font-size: var(--text-sm);
    border: 1px solid var(--color-border-strong);
    background: var(--color-surface);
    color: var(--color-ink);
    border-radius: var(--radius-sm);
    padding: 7px 9px;
    min-height: 34px;
    width: 100%;
    max-width: 220px;
  }
  .add-foreman-form input[type="text"]:focus { outline: 2px solid var(--color-focus); outline-offset: 1px; }
  .add-foreman-form input[type="text"]:disabled { opacity: 0.55; }
  .field-error {
    font-size: var(--text-xs);
    color: var(--color-danger);
    margin: 0;
    flex-basis: 100%;
  }

  /* ---------- date & time bar ---------- */
  .datetime-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
    flex-wrap: wrap;
    background: var(--color-surface-alt);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 8px 12px;
  }
  .datetime-date {
    font-family: var(--font-body);
    font-size: var(--text-sm);
    font-weight: 600;
    color: var(--color-ink);
  }
  .datetime-clock {
    font-family: var(--font-mono);
    font-size: var(--text-md);
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--color-accent);
  }
  .datetime-bar-compact {
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 2px;
    padding: 6px 10px;
  }
  .datetime-bar-compact .datetime-date { font-size: var(--text-xs); }
  .datetime-bar-compact .datetime-clock { font-size: var(--text-sm); }

  /* ---------- schedule (per-person forecast) ---------- */
  .foreman-entry { display: flex; flex-direction: column; gap: 6px; }
  .schedule-toggle-btn {
    flex: none;
    font-family: var(--font-body);
    font-size: var(--text-xs);
    font-weight: 600;
    border-radius: var(--radius-sm);
    padding: 5px 9px;
    min-height: 24px;
    border: 1px solid var(--color-border-strong);
    background: var(--color-surface);
    color: var(--color-ink-muted);
    cursor: pointer;
  }
  .schedule-toggle-btn:hover:not(:disabled) { background: var(--color-accent-soft); color: var(--color-accent); }
  .schedule-toggle-btn.is-open { background: var(--color-accent); color: var(--color-accent-ink); border-color: var(--color-accent); }
  .schedule-toggle-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---------- full-page schedule calendar ---------- */
  .calendar-overlay {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: var(--color-canvas);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .calendar-overlay[hidden] { display: none; }
  .calendar-overlay-header {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    padding: 12px 16px;
  }
  .overlay-header-datetime { margin-left: auto; flex-shrink: 0; }
  .calendar-back-btn {
    font-family: var(--font-body);
    font-size: var(--text-sm);
    font-weight: 600;
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    min-height: 38px;
    border: 1px solid var(--color-border-strong);
    background: var(--color-surface);
    color: var(--color-ink);
    cursor: pointer;
  }
  .calendar-back-btn:hover:not(:disabled) { background: var(--color-accent-soft); }
  .calendar-back-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .calendar-person-name {
    font-family: var(--font-display);
    font-size: var(--text-lg);
    font-weight: 600;
    color: var(--color-ink);
  }
  .calendar-month-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 16px 6px;
    flex-wrap: wrap;
  }
  .calendar-nav-btn, .calendar-today-btn {
    font-family: var(--font-body);
    font-size: var(--text-sm);
    font-weight: 600;
    border-radius: var(--radius-sm);
    padding: 8px 14px;
    min-height: 38px;
    border: 1px solid var(--color-border-strong);
    background: var(--color-surface);
    color: var(--color-ink);
    cursor: pointer;
  }
  .calendar-nav-btn:hover, .calendar-today-btn:hover { background: var(--color-accent-soft); }
  .calendar-month-label {
    font-family: var(--font-display);
    font-size: var(--text-xl);
    font-weight: 600;
    min-width: 220px;
    text-align: center;
    color: var(--color-ink);
  }
  .calendar-weekday-row, .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    padding: 0 16px;
  }
  .calendar-weekday-row { padding-top: 10px; padding-bottom: 4px; }
  .calendar-weekday-label {
    font-size: var(--text-xs);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--color-ink-muted);
    text-align: center;
  }
  .calendar-grid { padding-bottom: 16px; }
  .calendar-day-cell {
    position: relative;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    background: var(--color-surface);
    min-height: 76px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
  }
  .calendar-day-cell:hover { border-color: var(--color-border-strong); }
  .calendar-day-cell.is-other-month { opacity: 0.45; }
  .calendar-day-cell.is-today { outline: 2px solid var(--color-focus); outline-offset: -2px; }
  .calendar-day-cell.is-selected { border-color: var(--color-accent); border-width: 2px; }
  /* Marked "off" (job foreman not at work): a red X drawn corner-to-corner
     over the day box (var(--color-danger) so it stays visible against the
     dark-mode background too, instead of a fixed black). */
  .calendar-day-cell.is-off::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    border-radius: inherit;
    background:
      linear-gradient(to bottom right, transparent calc(50% - 1.5px), var(--color-danger) calc(50% - 1.5px), var(--color-danger) calc(50% + 1.5px), transparent calc(50% + 1.5px)),
      linear-gradient(to bottom left, transparent calc(50% - 1.5px), var(--color-danger) calc(50% - 1.5px), var(--color-danger) calc(50% + 1.5px), transparent calc(50% + 1.5px));
  }
  .calendar-day-number {
    font-family: var(--font-mono);
    font-size: var(--text-sm);
    font-weight: 600;
    color: var(--color-ink);
    /* Pinned to the top (flex column default) and centered horizontally,
       via align-self + a full-width text-align rather than anything tied
       to the cell's own height - so this holds no matter how tall the
       box grows from extra job chips or wrapped/long entries below it. */
    align-self: center;
    width: 100%;
    text-align: center;
  }
  .calendar-day-job {
    font-size: var(--text-xs);
    font-weight: 600;
    padding: 3px 5px;
    border-radius: 4px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* Task 2 / Task 3 job chips on the month grid - same shape as the
     primary job chip, but muted since only Task 1 carries a color. */
  .calendar-day-job-secondary {
    background: var(--color-surface-alt);
    border-left: 3px solid var(--color-border-strong);
    color: var(--color-ink-muted);
  }

  /* ---------- Combined Calendar (view-only - click a day to see every
     schedule tab's entries for it combined together; no editing happens
     here, that still only happens on each person's own Schedule tab) ---------- */
  .combined-calendar-grid .calendar-day-cell {
    min-height: 108px;
    align-items: stretch;
  }
  .combined-day-entries {
    display: flex;
    flex-direction: column;
    gap: 3px;
    width: 100%;
    max-height: 92px;
    overflow-y: auto;
  }
  .combined-day-entry {
    font-size: 10px;
    line-height: 1.3;
    padding: 2px 4px;
    border-radius: 3px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    border-left: 3px solid var(--color-border-strong);
    background: var(--color-surface-alt);
    color: var(--color-ink);
  }
  .combined-day-entry-name { font-weight: 700; }
  .combined-day-more {
    font-size: 10px;
    color: var(--color-ink-muted);
    font-weight: 600;
    padding: 2px 4px;
  }

  /* Day-detail panel below the grid: one card per person with a schedule
     entry that day, each keeping its own individually-selected color
     (never a shared "combined view" color) and labeled by division, so
     Plumbing and future HVAC entries stay visually distinct from each
     other while sitting side by side. */
  .combined-detail-card {
    border: 1px solid var(--color-border);
    border-left-width: 4px;
    border-radius: var(--radius-sm);
    background: var(--color-surface);
    padding: 10px 12px;
    margin-bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .combined-detail-card:last-child { margin-bottom: 0; }
  .combined-detail-card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .combined-detail-card-name { font-family: var(--font-display); font-size: var(--text-md); font-weight: 600; color: var(--color-ink); }
  .combined-detail-card-division {
    font-size: var(--text-xs);
    color: var(--color-ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }
  .combined-detail-tag {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 7px;
    border-radius: 999px;
    color: #FFFFFF;
  }
  .combined-detail-tag-off { background: var(--color-danger); }
  .combined-detail-tag-holiday { background: #1F9D4C; }
  .combined-detail-task-label {
    font-size: var(--text-xs);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--color-ink-muted);
    margin-top: 4px;
  }
  .combined-detail-field-value { font-size: var(--text-sm); color: var(--color-ink); word-break: break-word; }
  .combined-detail-empty { color: var(--color-ink-muted); font-size: var(--text-sm); padding: 8px 0; }

  .calendar-day-editor {
    margin: 4px 16px 24px;
    background: var(--color-surface-alt);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .calendar-day-editor[hidden] { display: none; }
  .calendar-day-editor-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .calendar-day-editor-title {
    font-family: var(--font-display);
    font-size: var(--text-md);
    font-weight: 600;
    color: var(--color-ink);
  }
  .calendar-field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 10px;
  }
  .calendar-field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .calendar-field.span-2 { grid-column: 1 / -1; }
  .calendar-field-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--color-ink-muted);
    font-weight: 600;
  }
  .calendar-field input {
    font-family: var(--font-body);
    font-size: var(--text-sm);
    border: 1px solid var(--color-border-strong);
    background: var(--color-surface);
    color: var(--color-ink);
    border-radius: var(--radius-sm);
    padding: 6px 8px;
    min-height: 34px;
    width: 100%;
  }
  .calendar-field input:focus { outline: 2px solid var(--color-focus); outline-offset: 1px; }
  .calendar-field input:disabled { opacity: 0.55; }
  .calendar-task-tabs-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .calendar-task-tab-btn {
    font-family: var(--font-body);
    font-size: var(--text-sm);
    font-weight: 600;
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    min-height: 32px;
    border: 1px solid var(--color-border-strong);
    background: var(--color-surface);
    color: var(--color-ink-muted);
    cursor: pointer;
  }
  .calendar-task-tab-btn:hover:not(:disabled) { background: var(--color-accent-soft); }
  .calendar-task-tab-btn.is-active { background: var(--color-accent-soft); color: var(--color-ink); border-color: var(--color-accent); }
  .calendar-task-tab-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .calendar-task-block { padding-top: 8px; margin-top: 2px; border-top: 1px dashed var(--color-border); }
  .calendar-task-block[hidden] { display: none; }
  .calendar-task-block-label {
    grid-column: 1 / -1;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--color-ink-muted);
    font-weight: 700;
  }
  .calendar-repeat-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    font-size: var(--text-sm);
    color: var(--color-ink-muted);
  }
  .calendar-repeat-row input[type="date"] {
    font-family: var(--font-body);
    font-size: var(--text-sm);
    border: 1px solid var(--color-border-strong);
    border-radius: var(--radius-sm);
    padding: 6px 8px;
    min-height: 34px;
  }
  .calendar-repeat-note { font-size: var(--text-xs); color: var(--color-ink-muted); }
  .calendar-color-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .calendar-color-row-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--color-ink-muted);
    font-weight: 600;
    margin-right: 2px;
  }
  .calendar-color-dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--color-border-strong);
    cursor: pointer;
    padding: 0;
  }
  .calendar-color-dot.is-selected { border-color: var(--color-ink); box-shadow: 0 0 0 2px var(--color-focus); }
  .calendar-color-dot:disabled { cursor: not-allowed; opacity: 0.6; }
  .calendar-off-btn {
    flex: none;
    font-family: var(--font-body);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-radius: var(--radius-sm);
    padding: 3px 8px;
    height: 22px;
    border: 1px solid var(--color-border-strong);
    background: var(--color-surface);
    color: var(--color-ink-muted);
    cursor: pointer;
    margin-left: 2px;
  }
  .calendar-off-btn:hover:not(:disabled) { background: var(--color-danger-soft); color: var(--color-danger); border-color: var(--color-danger); }
  .calendar-off-btn.is-marked-off { background: var(--color-danger); color: var(--color-accent-ink); border-color: var(--color-danger); }
  .calendar-off-btn.is-marked-off:hover:not(:disabled) { background: var(--color-danger); }
  .calendar-off-btn:disabled { cursor: not-allowed; opacity: 0.6; }

  /* Marked "holiday" (admin-applied company holiday, independent of the
     automatic US holiday text below): the whole day box is highlighted
     green instead of drawing an X over it. */
  .calendar-day-cell.is-holiday {
    background: #CFF3DA;
    border-color: #1F9D4C;
  }
  .calendar-day-cell.is-holiday:hover { border-color: #1F9D4C; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .calendar-day-cell.is-holiday {
      background: #163B24;
      border-color: #2FBE71;
    }
  }
  :root[data-theme="dark"] .calendar-day-cell.is-holiday {
    background: #163B24;
    border-color: #2FBE71;
  }
  .calendar-holiday-btn {
    flex: none;
    font-family: var(--font-body);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-radius: var(--radius-sm);
    padding: 3px 8px;
    height: 22px;
    border: 1px solid var(--color-border-strong);
    background: var(--color-surface);
    color: var(--color-ink-muted);
    cursor: pointer;
    margin-left: 2px;
  }
  .calendar-holiday-btn:hover:not(:disabled) { background: rgba(31, 157, 76, 0.16); color: #1F9D4C; border-color: #1F9D4C; }
  .calendar-holiday-btn.is-marked-holiday { background: #1F9D4C; color: #FFFFFF; border-color: #1F9D4C; }
  .calendar-holiday-btn.is-marked-holiday:hover:not(:disabled) { background: #1F9D4C; }
  .calendar-holiday-btn:disabled { cursor: not-allowed; opacity: 0.6; }

  /* Automatic US holiday label shown on every calendar day box (text
     always; a small animated icon for four of them). Not stored, not
     per-person - purely computed from the date. */
  .calendar-day-holiday {
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 9px;
    line-height: 1.2;
    font-weight: 600;
    color: var(--color-ink-muted);
    max-width: 100%;
  }
  .calendar-holiday-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .calendar-holiday-icon {
    display: inline-block;
    font-size: 12px;
    line-height: 1;
    flex: none;
  }
  @keyframes holiday-xmas-blink {
    0%, 100% { text-shadow: 0 0 2px #2ecc71, 0 0 4px #2ecc71; }
    25% { text-shadow: 0 0 2px #e74c3c, 0 0 4px #e74c3c; }
    50% { text-shadow: 0 0 2px #f1c40f, 0 0 4px #f1c40f; }
    75% { text-shadow: 0 0 2px #3498db, 0 0 4px #3498db; }
  }
  .calendar-holiday-christmas .calendar-holiday-icon {
    animation: holiday-xmas-blink 2s steps(1, end) infinite;
  }
  @keyframes holiday-turkey-gobble {
    0%, 100% { transform: rotate(0deg) scale(1); }
    20% { transform: rotate(-8deg) scale(1.05); }
    40% { transform: rotate(6deg) scale(0.97); }
    60% { transform: rotate(-4deg) scale(1.03); }
    80% { transform: rotate(3deg) scale(1); }
  }
  .calendar-holiday-thanksgiving .calendar-holiday-icon {
    animation: holiday-turkey-gobble 1.6s ease-in-out infinite;
  }
  @keyframes holiday-fireworks-burst {
    0% { transform: scale(0.6); opacity: 0.5; filter: brightness(1); }
    50% { transform: scale(1.25); opacity: 1; filter: brightness(1.4); }
    100% { transform: scale(0.6); opacity: 0.5; filter: brightness(1); }
  }
  .calendar-holiday-july4 .calendar-holiday-icon {
    animation: holiday-fireworks-burst 1.1s ease-in-out infinite;
  }
  @keyframes holiday-pumpkin-glow {
    0%, 100% { filter: drop-shadow(0 0 1px #ff9d1f) drop-shadow(0 0 2px #ff7300); }
    50% { filter: drop-shadow(0 0 4px #ffb347) drop-shadow(0 0 7px #ff8c00); }
  }
  .calendar-holiday-halloween .calendar-holiday-icon {
    animation: holiday-pumpkin-glow 1.8s ease-in-out infinite;
  }

  /* ---------- per-supervisor project list ---------- */
  .projects-toolbar { max-width: 1000px; margin: 0 auto; width: 100%; padding: 16px 16px 0; display: flex; justify-content: flex-end; }
  .projects-list { padding: 12px 16px 24px; max-width: 1000px; margin: 0 auto; width: 100%; overflow-x: auto; }
  .projects-table {
    display: flex;
    flex-direction: column;
    min-width: 860px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    overflow: hidden;
  }
  .project-table-head, .project-row {
    display: grid;
    grid-template-columns: 2fr 1.1fr 1.3fr 1.3fr 1.2fr 1.3fr 84px;
    gap: 8px;
    align-items: center;
    padding: 8px 10px;
  }
  .project-table-head {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--color-ink-muted);
    font-weight: 700;
    background: var(--color-surface-alt);
    border-bottom: 1px solid var(--color-border);
  }
  .project-row { background: var(--color-surface); border-bottom: 1px solid var(--color-border); }
  .project-row:last-child { border-bottom: none; }
  .project-row:nth-child(even) { background: var(--color-surface-alt); }
  .project-cell-input {
    font-family: var(--font-body);
    font-size: var(--text-sm);
    border: 1px solid transparent;
    background: transparent;
    color: var(--color-ink);
    border-radius: var(--radius-sm);
    padding: 6px 8px;
    min-height: 34px;
    width: 100%;
  }
  .project-cell-input:hover:not(:disabled) { border-color: var(--color-border-strong); }
  .project-cell-input:focus { border-color: var(--color-focus); outline: none; background: var(--color-surface); }
  .project-cell-input:disabled { opacity: 0.55; }
  .project-remove-btn {
    font-family: var(--font-body);
    font-size: var(--text-xs);
    font-weight: 600;
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    min-height: 30px;
    border: 1px solid var(--color-border-strong);
    background: var(--color-surface);
    color: var(--color-danger);
    cursor: pointer;
  }
  .project-remove-btn:hover:not(:disabled) { background: var(--color-danger-soft); }
  .project-remove-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .projects-empty { color: var(--color-ink-muted); font-size: var(--text-sm); padding: 12px 10px; }

  /* ---------- sign-in gate ---------- */
  .authgate-overlay {
    position: fixed;
    inset: 0;
    z-index: 60;
    background:
      radial-gradient(circle at 18% 8%, rgba(184, 92, 46, 0.10), transparent 55%),
      radial-gradient(circle at 88% 92%, rgba(31, 111, 111, 0.09), transparent 50%),
      var(--color-canvas);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .authgate-overlay[hidden] { display: none; }
  .authgate-card {
    width: 100%;
    max-width: 400px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    padding: 32px 28px 28px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .authgate-logo {
    height: 38px;
    width: auto;
    align-self: flex-start;
    background: #FFFFFF;
    padding: 5px 9px;
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-sm);
  }
  .authgate-eyebrow {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color-accent);
    font-weight: 600;

  var calendarViewDate = firstOfMonth(new Date());
  var calendarSelectedDk = null;
  var calendarRepeatNote = '';

  // Combined Calendar: a separate, read-only overlay with its own month
  // cursor (never shares calendarViewDate with the per-person calendar
  // above), so navigating one never disturbs the other.
  var combinedCalendarOpen = false;
  var combinedCalendarViewDate = firstOfMonth(new Date());
  var combinedCalendarSelectedDk = null;
  // Which division(s) the Combined Calendar currently shows: 'all' (both
  // Plumbing and HVAC together), 'Plumbing', or 'HVAC'. Resets to 'all'
  // every time the overlay is opened fresh.
  var combinedCalendarFilter = 'all';

  // A day's color is no longer derived automatically from its job name —
  // admins pick one manually from this fixed palette (stored as entry.color,
  // one of these keys, or '' for none).
  var DAY_COLOR_KEYS = ['black', 'red', 'orange', 'yellow', 'green', 'blue', 'purple'];
  var DAY_COLOR_HUES = { red: 0, orange: 28, yellow: 48, green: 140, blue: 213, purple: 275 };
  function colorForKey(key) {
    if (!key || DAY_COLOR_KEYS.indexOf(key) === -1) return null;
    if (key === 'black') return { bg: 'rgba(0, 0, 0, 0.30)', border: '#000000' };
    var hue = DAY_COLOR_HUES[key];
    return { bg: 'hsla(' + hue + ', 55%, 55%, 0.18)', border: 'hsl(' + hue + ', 50%, 45%)' };
  }

  function q(id) { return document.getElementById(id); }

  // Turns "jonathan@plumcore.com" into "Jonathan", "5-8@plumcore.com" into
  // "5 8", etc. — just the human-friendly part before the @, for a
  // cleaner "signed in as" chip than the full email address.
  function displayNameFromEmail(email) {
    var local = String(email || '').split('@')[0];
    var parts = local.split(/[._-]+/).filter(Boolean);
    if (!parts.length) return local;
    return parts.map(function (p) {
      if (/^[0-9]+$/.test(p)) return p;
      return p.charAt(0).toUpperCase() + p.slice(1).toLowerCase();
    }).join(' ');
  }

  function renderSignedInAs(email) {
    var displayName = displayNameFromEmail(email);
    var initial = (displayName.trim().charAt(0) || '?').toUpperCase();
    els.authSignedInAs.innerHTML = '';
    var avatar = document.createElement('span');
    avatar.className = 'authgate-avatar';
    avatar.textContent = initial;
    var nameSpan = document.createElement('span');
    nameSpan.className = 'authgate-signedin-name';
    nameSpan.textContent = displayName;
    var signOutSpan = document.createElement('span');
    signOutSpan.className = 'authgate-signout-label';
    signOutSpan.textContent = 'Sign out';
    els.authSignedInAs.title = email;
    els.authSignedInAs.appendChild(avatar);
    els.authSignedInAs.appendChild(nameSpan);
    els.authSignedInAs.appendChild(signOutSpan);
  }

  function enqueueWrite(fn) {
    writeChain = writeChain.then(fn, fn);
    return writeChain;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function cloneForemen(f) {
    return { sup2: (f.sup2 || []).slice(), sup3: (f.sup3 || []).slice() };
  }

  // Each person's forecast schedule lives in its own "schedules/<slug>"
  // document (not the main board doc), so it can carry a looser write
  // rule: any signed-in viewer can fill it in, while the org chart itself
  // (names, foremen) stays admin-only.
  function slugify(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9_\-.~:@+]/g, '-');
  }

  function cloneDayMap(days) {
    function sanitizeTask(t) {
      t = t || {};
      return {
        jobName: typeof t.jobName === 'string' ? t.jobName : '',
        po: typeof t.po === 'string' ? t.po : '',
        address: typeof t.address === 'string' ? t.address : '',
        stage: typeof t.stage === 'string' ? t.stage : '',
        pm: typeof t.pm === 'string' ? t.pm : '',
        contractor: typeof t.contractor === 'string' ? t.contractor : '',
        superintendent: typeof t.superintendent === 'string' ? t.superintendent : '',
        superintendentPhone: typeof t.superintendentPhone === 'string' ? t.superintendentPhone : ''
      };
    }
    var out = {};
    Object.keys(days || {}).forEach(function (dk) {
      var e = days[dk] || {};
      var base = sanitizeTask(e);
      base.task2 = sanitizeTask(e.task2);
      base.task3 = sanitizeTask(e.task3);
      base.color = (typeof e.color === 'string' && DAY_COLOR_KEYS.indexOf(e.color) !== -1) ? e.color : '';
      base.off = e.off === true;
      base.holiday = e.holiday === true;
      out[dk] = base;
    });
    return out;
  }

  var dbHandle = null;
  var scheduleDocsCache = {};
  var scheduleSubs = {};
  var authReadyResolve = null;
  var authReady = new Promise(function (res) { authReadyResolve = res; });
  var scheduleReadyResolvers = {};
  var scheduleReadyPromises = {};
  var lastWriteError = '';

  function ensureScheduleSub(personKey) {
    if (scheduleSubs[personKey]) return;
    scheduleSubs[personKey] = true; // claim immediately so a second call can't double-queue
    scheduleReadyPromises[personKey] = new Promise(function (res) {
      scheduleReadyResolvers[personKey] = res;
    });
    authReady.then(function () {
      var ref = doc(dbHandle, 'schedules', slugify(personKey));
      scheduleSubs[personKey] = onSnapshot(ref, function (snap) {
        scheduleDocsCache[personKey] = snap.exists() ? cloneDayMap(snap.data()) : {};
        if (scheduleReadyResolvers[personKey]) { scheduleReadyResolvers[personKey](); scheduleReadyResolvers[personKey] = null; }
        render();
      }, function () {
        scheduleDocsCache[personKey] = scheduleDocsCache[personKey] || {};
        if (scheduleReadyResolvers[personKey]) { scheduleReadyResolvers[personKey](); scheduleReadyResolvers[personKey] = null; }
        render();
      });
    });
  }

  // ---------------- Per-supervisor project list (Jimmy/Chris "Projects" tab) ----------------
  // Same shape as the schedules/* sync above, but the whole list lives in one
  // doc per supervisor (projects/sup2, projects/sup3) as an `items` array —
  // there's no per-day keying to worry about, so writes just replace the
  // whole array. Same looser "any signed-in user can edit" rule as Schedule.
  function cloneProjectsList(items) {
    return (Array.isArray(items) ? items : []).map(function (it) {
      it = it || {};
      return {
        id: (typeof it.id === 'string' && it.id) ? it.id : (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)),
        job: typeof it.job === 'string' ? it.job : '',
        startDate: typeof it.startDate === 'string' ? it.startDate : '',
        contractor: typeof it.contractor === 'string' ? it.contractor : '',
        contact: typeof it.contact === 'string' ? it.contact : '',
        contactPhone: typeof it.contactPhone === 'string' ? it.contactPhone : '',
        pm: typeof it.pm === 'string' ? it.pm : ''
      };
    });
  }

  var projectsDocsCache = {};
  var projectsSubs = {};
  var projectsReadyResolvers = {};
  var projectsReadyPromises = {};

  function ensureProjectsSub(supKey) {
    if (projectsSubs[supKey]) return;
    projectsSubs[supKey] = true;
    projectsReadyPromises[supKey] = new Promise(function (res) {
      projectsReadyResolvers[supKey] = res;
    });
    authReady.then(function () {
      var ref = doc(dbHandle, 'projects', slugify(supKey));
      projectsSubs[supKey] = onSnapshot(ref, function (snap) {
        projectsDocsCache[supKey] = snap.exists() ? cloneProjectsList(snap.data().items) : [];
        if (projectsReadyResolvers[supKey]) { projectsReadyResolvers[supKey](); projectsReadyResolvers[supKey] = null; }
        render();
      }, function () {
        projectsDocsCache[supKey] = projectsDocsCache[supKey] || [];
        if (projectsReadyResolvers[supKey]) { projectsReadyResolvers[supKey](); projectsReadyResolvers[supKey] = null; }
        render();
      });
    });
  }

  function saveProjectsList(supKey, items) {
    var readyPromise = projectsReadyPromises[supKey];
    if (!dbHandle || !readyPromise) return;
    var cleaned = cloneProjectsList(items);
    readyPromise.then(function () {
      var ref = doc(dbHandle, 'projects', slugify(supKey));
      projectsDocsCache[supKey] = cleaned;
      lastWriteError = '';
      render();
      enqueueWrite(function () {
        return setDoc(ref, { items: cleaned }, { merge: true }).catch(function (err) { handleProjectsWriteError(err); });
      });
    });
  }

  function handleProjectsWriteError(err) {
    if (err && err.code === 'unauthenticated') {
      disconnected = true;
    } else if (err && err.code === 'permission-denied') {
      lastWriteError = "Couldn't save this project list — you may not have edit access.";
    } else if (err) {
      lastWriteError = "Couldn't save this project list. Try again.";
    }
    render();
  }

  function inputForName(which) {
    if (which === 'sup1Name') return els.sup1Input;
    if (which === 'sup2Name') return els.sup2Input;
    if (which === 'sup3Name') return els.sup3Input;
    if (which === 'sup4Name') return els.sup4Input;
    if (which === 'sup5Name') return els.sup5Input;
    if (which === 'sup7Name') return els.sup7Input;
    if (which === 'hvac1Name') return els.hvac1Input;
    if (which === 'hvac2Name') return els.hvac2Input;
    if (which === 'hvac3Name') return els.hvac3Input;
    if (which === 'hvac4Name') return els.hvac4Input;
    return els.sup6Input;
  }

  function handleWriteError(err, opts) {
    opts = opts || {};
    if (err && err.code === 'permission-denied') {
      canEdit = false;
      if (opts.revertName) {
        state[opts.revertName] = confirmedNames[opts.revertName];
      }
    } else if (err && err.code === 'unauthenticated') {
      canEdit = false;
      disconnected = true;
    } else if (err && err.code === 'not-found') {
      triedInit = false;
      lastWriteError = "Couldn't save — the board record is missing. Reload the page.";
    } else if (err) {
      lastWriteError = "Couldn't save your change. Try again.";
    }
    // unavailable / resource-exhausted / deadline-exceeded / aborted:
    // transient — leave canEdit as-is.
    render();
  }

  // ---------------- Sign-in gate (email link, @plumcore.com only) ----------------
  function setGateMessage(text, isError) {
    els.authGateMsg.textContent = text || '';
    els.authGateMsg.className = 'authgate-msg' + (text ? (isError ? ' is-error' : ' is-info') : '');
  }

  function setGateBusy(busy) {
    els.authEmailInput.disabled = busy;
    els.authPasswordInput.disabled = busy;
    els.authSendBtn.disabled = busy;
  }

  function renderGateMode() {
    var isAdminMode = authGateMode === 'admin';
    els.authPasswordInput.hidden = !isAdminMode;
    els.authFirstTimeToggle.hidden = !isAdminMode;
    if (isAdminMode) {
      els.authGateSub.textContent = 'Admin sign-in. Enter your @plumcore.com email and password.';
      els.authModeToggle.textContent = 'Not an admin? Use email link instead';
      els.authFirstTimeToggle.textContent = authAdminFirstTime
        ? 'Already have a password? Sign in instead'
        : 'First time? Create your password instead';
      els.authSendBtn.textContent = authAdminFirstTime ? 'Create password & sign in' : 'Sign in';
    } else {
      els.authGateSub.textContent = "Enter your @plumcore.com email. We'll email you a one-time link to sign in — no password needed.";
      els.authModeToggle.textContent = 'Admin? Sign in with a password instead';
      els.authSendBtn.textContent = 'Send sign-in link';
    }
    setGateMessage('', false);
  }

  function onAuthModeToggle() {
    authGateMode = authGateMode === 'admin' ? 'employee' : 'admin';
    authAdminFirstTime = false;
    els.authPasswordInput.value = '';
    renderGateMode();
  }

  function onAuthFirstTimeToggle() {
    authAdminFirstTime = !authAdminFirstTime;
    renderGateMode();
  }

  function submitAdminSignIn(email, password) {
    setGateBusy(true);
    setGateMessage(authAdminFirstTime ? 'Creating your password…' : 'Signing you in…', false);
    var authCall = authAdminFirstTime
      ? createUserWithEmailAndPassword(firebaseAuth, email, password)
      : signInWithEmailAndPassword(firebaseAuth, email, password);
    authCall.catch(function (err) {
      setGateBusy(false);
      var code = err && err.code;
      if (code === 'auth/email-already-in-use') {
        setGateMessage('That email already has a password set. Switch to "Sign in" and use it.', true);
      } else if (code === 'auth/weak-password') {
        setGateMessage('Choose a password with at least 6 characters.', true);
      } else if (code === 'auth/wrong-password' || code === 'auth/invalid-credential') {
        setGateMessage('Incorrect email or password.', true);
      } else if (code === 'auth/user-not-found') {
        setGateMessage('No admin account yet for that email. Use "First time? Create your password instead."', true);
      } else {
        setGateMessage("Couldn't sign you in. Try again in a moment.", true);
      }
    });
  }

  function requestSignInLink(email) {
    var actionCodeSettings = {
      url: window.location.origin + window.location.pathname,
      handleCodeInApp: true
    };
    setGateBusy(true);
    setGateMessage('Sending your sign-in link…', false);
    sendSignInLinkToEmail(firebaseAuth, email, actionCodeSettings).then(function () {
      try { window.localStorage.setItem(AUTH_EMAIL_STORAGE_KEY, email); } catch (e) {}
      setGateBusy(false);
      setGateMessage('Check your email (' + email + ') for a sign-in link, then open it on this device.', false);
    }).catch(function (err) {
      setGateBusy(false);
      setGateMessage("Couldn't send that link. Try again in a moment.", true);
    });
  }

  function completeSignInFromLink() {
    if (!isSignInWithEmailLink(firebaseAuth, window.location.href)) return false;
    var storedEmail = null;
    try { storedEmail = window.localStorage.getItem(AUTH_EMAIL_STORAGE_KEY); } catch (e) {}
    if (!storedEmail) {
      setGateMessage('Confirm your @plumcore.com email to finish signing in.', false);
      return true; // gate stays up; wireStaticControls' submit handler will complete the link
    }
    finishEmailLinkSignIn(storedEmail);
    return true;
  }

  function finishEmailLinkSignIn(email) {
    setGateBusy(true);
    setGateMessage('Signing you in…', false);
    signInWithEmailLink(firebaseAuth, email, window.location.href).then(function () {
      try { window.localStorage.removeItem(AUTH_EMAIL_STORAGE_KEY); } catch (e) {}
      window.history.replaceState(null, '', window.location.pathname);
    }).catch(function (err) {
      setGateBusy(false);
      setGateMessage("That sign-in link didn't work — it may have expired. Request a new one.", true);
      window.history.replaceState(null, '', window.location.pathname);
    });
  }

  function onAuthGateSubmit(e) {
    e.preventDefault();
    var email = (els.authEmailInput.value || '').trim();
    if (!PLUMCORE_EMAIL_RE.test(email)) {
      setGateMessage('Enter a valid @plumcore.com email address.', true);
      return;
    }
    if (authGateMode === 'admin') {
      var password = els.authPasswordInput.value || '';
      if (password.length < 6) {
        setGateMessage('Enter your password (at least 6 characters).', true);
        return;
      }
      submitAdminSignIn(email, password);
      return;
    }
    if (isSignInWithEmailLink(firebaseAuth, window.location.href)) {
      finishEmailLinkSignIn(email);
    } else {
      requestSignInLink(email);
    }
  }

  // ---------------- DB wiring ----------------
  function boot() {
    render();
    var pendingLinkCompletion = completeSignInFromLink();
    if (!pendingLinkCompletion) setGateMessage('', false);
    // Watchdog on whether the FIRST snapshot ever arrives (not just whether
    // auth succeeded) — a Firestore listen can open its channel and then
    // never deliver data, and nothing used to catch that case.
    var dataTimer = null;
    onAuthStateChanged(firebaseAuth, function (user) {
      if (user && user.isAnonymous) {
        // Leftover anonymous session from before sign-in was required.
        // Clear it so the real sign-in gate shows instead of a broken
        // "signed in as null" state that Firestore will reject anyway.
        signOut(firebaseAuth);
        return;
      }
      currentUser = user || null;
      if (!user) {
        els.authGateOverlay.hidden = false;
        els.authSignedInAs.hidden = true;
        setGateBusy(false);
        return;
      }
      els.authGateOverlay.hidden = true;
      els.authSignedInAs.hidden = false;
      renderSignedInAs(user.email);
      if (docRef) return; // already booted for this page load
      dataTimer = setTimeout(function () {
        if (loaded) return;
        dbUnavailable = true; render();
      }, 15000);
      dbUnavailable = false;
      dbHandle = firestoreDb;
      docRef = doc(firestoreDb, 'board/week1');
      getDoc(doc(firestoreDb, 'admins', 'config')).then(function (snap) {
        var emails = (snap.exists() && Array.isArray(snap.data().emails)) ? snap.data().emails : [];
        isAdminUser = emails.some(function (e) { return typeof e === 'string' && e.toLowerCase() === user.email.toLowerCase(); });
        canEdit = isAdminUser;
        render();
      }).catch(function () {
        isAdminUser = false;
        canEdit = false;
        render();
      });
      authReadyResolve();
      onSnapshot(docRef, function (snap) {
        clearTimeout(dataTimer);
        loaded = true;
        disconnected = false;
        if (snap.exists()) {
          var data = snap.data() || {};
          state.sup1Name = (typeof data.sup1Name === 'string' && data.sup1Name) ? data.sup1Name : SUP_FALLBACK.sup1Name;
          state.sup2Name = (typeof data.sup2Name === 'string' && data.sup2Name) ? data.sup2Name : SUP_FALLBACK.sup2Name;
          state.sup3Name = (typeof data.sup3Name === 'string' && data.sup3Name) ? data.sup3Name : SUP_FALLBACK.sup3Name;
          state.sup4Name = (typeof data.sup4Name === 'string' && data.sup4Name) ? data.sup4Name : SUP_FALLBACK.sup4Name;
          state.sup5Name = (typeof data.sup5Name === 'string' && data.sup5Name) ? data.sup5Name : SUP_FALLBACK.sup5Name;
          state.sup6Name = (typeof data.sup6Name === 'string' && data.sup6Name) ? data.sup6Name : SUP_FALLBACK.sup6Name;
          state.sup7Name = (typeof data.sup7Name === 'string' && data.sup7Name) ? data.sup7Name : 'Charlie Cheetum';
          state.hvac1Name = (typeof data.hvac1Name === 'string' && data.hvac1Name) ? data.hvac1Name : SUP_FALLBACK.hvac1Name;
          state.hvac2Name = (typeof data.hvac2Name === 'string' && data.hvac2Name) ? data.hvac2Name : SUP_FALLBACK.hvac2Name;
          state.hvac3Name = (typeof data.hvac3Name === 'string' && data.hvac3Name) ? data.hvac3Name : SUP_FALLBACK.hvac3Name;
          state.hvac4Name = (typeof data.hvac4Name === 'string' && data.hvac4Name) ? data.hvac4Name : SUP_FALLBACK.hvac4Name;
          var f = (data.foremen && typeof data.foremen === 'object') ? data.foremen : {};
          state.foremen = {
            sup2: Array.isArray(f.sup2) ? f.sup2.filter(function (t) { return typeof t === 'string' && t; }) : [],
            sup3: Array.isArray(f.sup3) ? f.sup3.filter(function (t) { return typeof t === 'string' && t; }) : []
          };
          confirmedNames.sup1Name = state.sup1Name;
          confirmedNames.sup2Name = state.sup2Name;
          confirmedNames.sup3Name = state.sup3Name;
          confirmedNames.sup4Name = state.sup4Name;
          confirmedNames.sup5Name = state.sup5Name;
          confirmedNames.sup6Name = state.sup6Name;
          confirmedNames.sup7Name = state.sup7Name;
          confirmedNames.hvac1Name = state.hvac1Name;
          confirmedNames.hvac2Name = state.hvac2Name;
          confirmedNames.hvac3Name = state.hvac3Name;
          confirmedNames.hvac4Name = state.hvac4Name;
        } else {
          // The shared board doc came back missing. This used to auto-recreate
          // it with blank default names/foremen — which is exactly how real
          // data got silently overwritten (a reconnect or a transient blip can
          // make Firestore report "not found" even when the doc is really
          // there). Never auto-write here. Just surface it loudly and stop;
          // an admin has to look at this on purpose before anything is
          // touched. See window.__fabForceInitBoard if a board genuinely
          // needs to be created for the first time.
          triedInit = true;
          boardMissing = true;
          dbUnavailable = true;
        }
        render();
      }, function (err) {
        clearTimeout(dataTimer);
        if (!loaded) { dbUnavailable = true; } else { disconnected = true; }
        render();
      });
    });
  }

  // ---------------- Write actions ----------------
  function saveSupName(which) {
    var raw = inputForName(which).value;
    var fallback = SUP_FALLBACK[which];
    var v = raw.trim().slice(0, 40) || fallback;
    state[which] = v;
    render();
    var patch = {}; patch[which] = v;
    lastWriteError = '';
    authReady.then(function () {
      enqueueWrite(function () {
        return updateDoc(docRef, patch).catch(function (err) { handleWriteError(err, { revertName: which }); });
      });
    });
  }

  function onSupInput(which, value) {
    state[which] = value;
    render();
    clearTimeout(nameDebounce[which]);
    nameDebounce[which] = setTimeout(function () { saveSupName(which); }, 500);
  }

  function addForeman(supKey, name, errorEl) {
    var v = name.trim().slice(0, 40);
    errorEl.hidden = true;
    if (!v) return false;
    var list = state.foremen[supKey] || [];
    if (list.indexOf(v) !== -1) {
      errorEl.textContent = v + ' is already listed under this supervisor.';
      errorEl.hidden = false;
      return false;
    }
    var merged = cloneForemen(state.foremen);
    merged[supKey] = list.concat([v]);
    lastWriteError = '';
    authReady.then(function () {
      enqueueWrite(function () {
        return updateDoc(docRef, { foremen: merged }).catch(function (err) { handleWriteError(err); });
      });
    });
    return true;
  }

  function removeForeman(supKey, name) {
    var merged = cloneForemen(state.foremen);
    merged[supKey] = (merged[supKey] || []).filter(function (n) { return n !== name; });
    lastWriteError = '';
    authReady.then(function () {
      enqueueWrite(function () {
        return updateDoc(docRef, { foremen: merged }).catch(function (err) { handleWriteError(err); });
      });
    });
  }

  function clearAllForemen() {
    if (!window.confirm('Remove all Job Foremen from every supervisor? This cannot be undone.')) return;
    lastWriteError = '';
    authReady.then(function () {
      enqueueWrite(function () {
        return updateDoc(docRef, { foremen: { sup2: [], sup3: [] } }).catch(function (err) { handleWriteError(err); });
      });
    });
  }

  function saveScheduleEntry(personKey, dk, fields) {
    var readyPromise = scheduleReadyPromises[personKey];
    if (!dbHandle || !readyPromise) return; // panel was never opened via ensureScheduleSub; shouldn't happen from the UI
    function sanitizeTask(t) {
      t = t || {};
      return {
        jobName: (t.jobName || '').trim().slice(0, 60),
        po: (t.po || '').trim().slice(0, 30),
        address: (t.address || '').trim().slice(0, 100),
        stage: (t.stage || '').trim().slice(0, 60),
        pm: (t.pm || '').trim().slice(0, 60),
        contractor: (t.contractor || '').trim().slice(0, 60),
        superintendent: (t.superintendent || '').trim().slice(0, 60),
        superintendentPhone: (t.superintendentPhone || '').trim().slice(0, 20)
      };
    }
    function taskHasData(t) {
      return !!(t.jobName || t.po || t.address || t.stage || t.pm || t.contractor || t.superintendent || t.superintendentPhone);
    }
    var task1 = sanitizeTask(fields);
    var task2 = sanitizeTask(fields.task2);
    var task3 = sanitizeTask(fields.task3);
    var color = DAY_COLOR_KEYS.indexOf(fields.color) !== -1 ? fields.color : '';
    var off = fields.off === true;
    var holiday = fields.holiday === true;
    var isEmpty = !taskHasData(task1) && !taskHasData(task2) && !taskHasData(task3) && !color && !off && !holiday;
    readyPromise.then(function () {
      var ref = doc(dbHandle, 'schedules', slugify(personKey));
      var localDayMap = cloneDayMap(scheduleDocsCache[personKey]);
      var patch = {};
      if (isEmpty) {
        delete localDayMap[dk];
        patch[dk] = deleteField();
      } else {
        localDayMap[dk] = {
          jobName: task1.jobName, po: task1.po, address: task1.address, stage: task1.stage,
          pm: task1.pm, contractor: task1.contractor, superintendent: task1.superintendent, superintendentPhone: task1.superintendentPhone,
          task2: task2, task3: task3,
          color: color, off: off, holiday: holiday
        };
        patch[dk] = localDayMap[dk];
      }
      scheduleDocsCache[personKey] = localDayMap;
      lastWriteError = '';
      enqueueWrite(function () {
        return setDoc(ref, patch, { merge: true }).catch(function (err) { handleScheduleWriteError(err); });
      });
    });
  }

  // Schedule writes use their own (looser) rule, so a rejection here
  // means connectivity/lifecycle trouble, not an admin-only board edit —
  // never flips the board's canEdit flag.
  function handleScheduleWriteError(err) {
    if (err && err.code === 'unauthenticated') {
      disconnected = true;
    } else if (err && err.code === 'permission-denied') {
      lastWriteError = "Couldn't save this schedule entry — you may not have edit access.";
    } else if (err) {
      lastWriteError = "Couldn't save this schedule entry. Try again.";
    }
    render();
  }

  // division on the board - this is the single place the Combined Calendar
  // reads from, so adding a new division's crew here is the only change
  // needed to fold them into the combined view too.
  function getAllSchedulePersonEntries() {
    var list = [];

    ['sup4', 'sup5', 'sup6', 'sup7'].forEach(function (supKey) {
      list.push({ key: supKey, name: state[supKey + 'Name'] || supKey, division: 'Plumbing' });
    });
    SUP_KEYS.forEach(function (supKey) { // ['sup2', 'sup3'] - each has a dynamic Job Foremen list
      (state.foremen[supKey] || []).forEach(function (name) {
        list.push({ key: 'foreman:' + supKey + ':' + name, name: name, division: 'Plumbing' });
      });
    });
    // ---- HVAC division ----
    // First four HVAC Job Foremen (added 2026-09-25), same fixed-role
    // pattern as the Plumbing sup4-7 block above (individually named,
    // each with its own Schedule tab) rather than the dynamic sup2/sup3
    // foreman-list mechanism, since there's no HVAC supervisor yet.
    ['hvac1', 'hvac2', 'hvac3', 'hvac4'].forEach(function (hvacKey) {
      list.push({ key: hvacKey, name: state[hvacKey + 'Name'] || hvacKey, division: 'HVAC' });
    });
    return list;

  // ---------------- Rendering ----------------
  function renderStatusBanner() {
    var banner = els.statusBanner;
    if (lastWriteError) {
      banner.hidden = false;
      banner.className = 'status-banner status-error';
      banner.textContent = lastWriteError;
      return;
    }
    if (boardMissing) {
      banner.hidden = false;
      banner.className = 'status-banner status-error';
      banner.textContent = "The shared board data couldn't be found. Nothing has been changed — contact your admin before doing anything else here.";
      return;
    }
    if (dbUnavailable) {
      banner.hidden = false;
      banner.className = 'status-banner status-error';
      banner.textContent = "Can't connect to the shared board right now. Check your connection and reopen this page.";
      return;
    }
    if (disconnected) {
      banner.hidden = false;
      banner.className = 'status-banner status-warning';
      banner.textContent = 'Connection lost — showing the last saved version. Reopen the page to reconnect.';
      return;
    }
    if (!loaded) {
      banner.hidden = false;
      banner.className = 'status-banner status-info';
      banner.textContent = 'Connecting to the shared board…';
      return;
    }
    if (!canEdit) {
      banner.hidden = false;
      banner.className = 'status-banner status-info';
      banner.textContent = 'View only — ask your project manager for edit access to make changes here.';
      return;

    banner.hidden = true;

  // ---------------- Full-page schedule calendar ----------------
  var WEEKDAY_HEADERS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  function buildWeekdayRow() {
    if (els.calendarWeekdayRow.childNodes.length) return;

  function renderCalendarGrid(personKey, disableControls) {
    var grid = els.calendarGrid;
    grid.innerHTML = '';
    var entries = scheduleDocsCache[personKey] || {};
    var year = calendarViewDate.getFullYear();
    var month = calendarViewDate.getMonth();
    var firstDay = new Date(year, month, 1);
    var gridStart = addDays(firstDay, -firstDay.getDay());
    var todayKey = dateKey(new Date());

    for (var i = 0; i < 42; i++) {
      (function () {
        var date = addDays(gridStart, i);
        var dk = dateKey(date);
        var entry = entries[dk];

        var cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'calendar-day-cell';
        if (date.getMonth() !== month) cell.classList.add('is-other-month');
        if (dk === todayKey) cell.classList.add('is-today');
        if (dk === calendarSelectedDk) cell.classList.add('is-selected');
        if (entry && entry.off) cell.classList.add('is-off');
        if (entry && entry.holiday) cell.classList.add('is-holiday');

        var num = document.createElement('span');
        num.className = 'calendar-day-number';
        num.textContent = String(date.getDate());
        cell.appendChild(num);

        // US holiday label — computed from the date itself, shown on every
        // calendar automatically, never stored. Four holidays also get a
        // small animated icon (see the calendar-holiday-* CSS).
        var hol = holidayForDate(date);
        if (hol) {
          var holWrap = document.createElement('span');
          holWrap.className = 'calendar-day-holiday' + (hol.kind ? ' calendar-holiday-' + hol.kind : '');
          if (hol.kind) {
            var holIcon = document.createElement('span');
            holIcon.className = 'calendar-holiday-icon';
            holIcon.textContent = HOLIDAY_ICONS[hol.kind];
            holIcon.setAttribute('aria-hidden', 'true');
            holWrap.appendChild(holIcon);
          }
          var holText = document.createElement('span');
          holText.className = 'calendar-holiday-text';
          holText.textContent = hol.name;
          holWrap.appendChild(holText);
          cell.appendChild(holWrap);
        }

        if (entry && entry.jobName) {
          var chip = document.createElement('span');
          chip.className = 'calendar-day-job';
          chip.textContent = entry.jobName;
          var c = colorForKey(entry.color);
          if (c) {
            chip.style.background = c.bg;
            chip.style.color = 'var(--color-ink)';
            chip.style.borderLeft = '3px solid ' + c.border;
          }
          cell.appendChild(chip);

        if (entry && entry.task2 && entry.task2.jobName) {
          var chip2 = document.createElement('span');
          chip2.className = 'calendar-day-job calendar-day-job-secondary';
          chip2.textContent = entry.task2.jobName;
          cell.appendChild(chip2);
        }
        if (entry && entry.task3 && entry.task3.jobName) {

          chip3.className = 'calendar-day-job calendar-day-job-secondary';
          chip3.textContent = entry.task3.jobName;
